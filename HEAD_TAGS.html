<title>AfriChess — African Chess Platform</title>

<!-- ═══ Structured data — Sitelinks hint ═══ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "AfriChess",
  "url": "https://www.africhess.org",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://www.africhess.org/search?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
