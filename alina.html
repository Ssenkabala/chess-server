<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Alina 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scrollbar-gutter: stable;
    }

    body {
      min-height: 100vh;
      width: 100%;
      font-family: 'Lora', Georgia, serif;
      background: radial-gradient(ellipse at 30% 20%, #2d1045 0%, #1a0e24 50%, #0f0a1a 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      padding: 2.5rem 1rem 3rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 80%, rgba(255,182,193,0.07) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(216,150,255,0.08) 0%, transparent 45%),
        radial-gradient(circle at 60% 60%, rgba(255,192,203,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Floating bubbles */
    .bubbles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,192,203,0.12), transparent 70%);
      animation: float-bubble linear infinite;
    }
    @keyframes float-bubble {
      0%   { transform: translateY(110vh) scale(0.8); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 10;
      max-width: 560px;
      width: 90%;
      text-align: center;
      padding: 2rem 1rem;
      margin: auto;
    }

    .crown {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 0.6rem;
      filter: drop-shadow(0 0 12px rgba(255,182,193,0.6));
      animation: gentle-bob 3s ease-in-out infinite;
    }
    @keyframes gentle-bob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      font-weight: 400;
      color: #f5d0e8;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.88rem;
      color: rgba(255,200,220,0.5);
      font-style: italic;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }

    .message-box {
      background: rgba(255,240,245,0.04);
      border: 1px solid rgba(255,182,193,0.2);
      border-radius: 20px;
      padding: 2rem 2.2rem;
      min-height: 140px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 40px rgba(255,182,193,0.05), inset 0 0 30px rgba(255,255,255,0.02);
      transition: box-shadow 0.4s, border-color 0.4s;
    }
    .message-box.glowing {
      box-shadow: 0 0 60px rgba(255,182,193,0.15), inset 0 0 30px rgba(255,255,255,0.03);
      border-color: rgba(255,182,193,0.4);
    }

    #message-text {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #f9e4ef;
      font-style: italic;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    #message-text.revealed { opacity: 1; transform: translateY(0); }

    .placeholder {
      color: rgba(255,200,220,0.25);
      font-size: 0.95rem;
      font-style: italic;
      letter-spacing: 0.03em;
    }

    .dots { display: flex; gap: 6px; align-items: center; justify-content: center; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,182,193,0.6);
      animation: dot-bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%, 100% { transform: scale(0.7); opacity: 0.4; }
      50%       { transform: scale(1.2); opacity: 1; }
    }

    button {
      background: linear-gradient(135deg, #e8a0bf 0%, #c96ca0 50%, #a44a7e 100%);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 0.9rem 2.2rem;
      font-family: 'Lora', Georgia, serif;
      font-size: 1rem;
      font-style: italic;
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 20px rgba(201,108,160,0.4);
      transition: transform 0.15s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }
    button::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      border-radius: 50px;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 30px rgba(201,108,160,0.55), 0 0 0 4px rgba(232,160,191,0.15);
    }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    button.shake { animation: btn-shake 0.5s ease; }
    @keyframes btn-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px) rotate(-1deg); }
      40% { transform: translateX(4px) rotate(1deg); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    .footer { margin-top: 2.5rem; color: rgba(255,200,220,0.25); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }

    /* Sparkles */
    .sparkle {
      position: fixed;
      font-size: 1.4rem;
      pointer-events: none;
      z-index: 9999;
      animation: sparkle-fly 1.2s ease-out forwards;
    }
    @keyframes sparkle-fly {
      0%   { transform: scale(0) rotate(0deg); opacity: 1; }
      60%  { transform: scale(1.3) rotate(180deg); opacity: 1; }
      100% { transform: scale(0.5) rotate(360deg) translateY(-30px); opacity: 0; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.6rem; }
      #message-text { font-size: 0.98rem; }
      .message-box { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Floating bubbles -->
  <div class="bubbles" id="bubbles"></div>

  <div class="card">
    <span class="crown">🌸</span>
    <h1>You're everything,<br>Alina</h1>
    <p class="subtitle">press the button, Lina. you deserve it. 💕</p>

    <div class="message-box" id="message-box">
      <p class="placeholder" id="placeholder">something beautiful is waiting for you, Luna ✨</p>
      <div class="dots" id="dots" style="display:none">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <p id="message-text"></p>
    </div>

    <button id="btn" onclick="getReassurance()">Tell me something sweet, Lina 🌸</button>

    <p class="footer">made with 💕 just for Alina</p>
  </div>

  <script>
    const SPARKLES = ["✨","💫","🌸","💕","🌷","🫧","🌼","💝","🌺","⭐"];
    const LABELS = [
      "Tell me something sweet, Lina 🌸",
      "I need a hug 🤗",
      "Reassure me, Luna 💕",
      "Say something nice 🌷",
      "Be my cheerleader 🎀",
      "I need to hear it, Alina 🫶",
    ];

    // Build bubbles
    const bubblesEl = document.getElementById("bubbles");
    for (let i = 0; i < 8; i++) {
      const b = document.createElement("div");
      b.className = "bubble";
      b.style.cssText = `width:${60+i*30}px;height:${60+i*30}px;left:${(i*13+5)%95}%;animation-duration:${12+i*3}s;animation-delay:${i*1.8}s`;
      bubblesEl.appendChild(b);
    }

    function spawnSparkles(count = 16) {
      for (let i = 0; i < count; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        s.textContent = SPARKLES[Math.floor(Math.random() * SPARKLES.length)];
        s.style.left = Math.random() * window.innerWidth + "px";
        s.style.top  = Math.random() * window.innerHeight + "px";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1300);
      }
    }

    async function getReassurance() {
      const btn = document.getElementById("btn");
      const box = document.getElementById("message-box");
      const placeholder = document.getElementById("placeholder");
      const dots = document.getElementById("dots");
      const msgEl = document.getElementById("message-text");

      btn.disabled = true;
      btn.textContent = "sending love to you, Alina...";
      btn.classList.add("shake");
      setTimeout(() => btn.classList.remove("shake"), 600);

      placeholder.style.display = "none";
      msgEl.classList.remove("revealed");
      msgEl.textContent = "";
      dots.style.display = "flex";
      box.classList.remove("glowing");

      try {
        const res = await fetch("/reassure", { method: "POST" });
        const data = await res.json();
        // Strip any markdown headings or formatting Claude might return
        const clean = data.message
          .replace(/^#+\s.*\n?/gm, "")   // remove # headings
          .replace(/\*\*(.*?)\*\*/g, "$1") // remove bold
          .replace(/\*(.*?)\*/g, "$1")     // remove italic markers
          .trim();
        dots.style.display = "none";
        msgEl.textContent = clean;
        setTimeout(() => {
          msgEl.classList.add("revealed");
          box.classList.add("glowing");
          spawnSparkles(16);
        }, 80);
      } catch {
        dots.style.display = "none";
        msgEl.textContent = "Alina, you are so wonderfully you, and that is more than enough. 🌸";
        msgEl.classList.add("revealed");
      }

      btn.disabled = false;
      btn.textContent = LABELS[Math.floor(Math.random() * LABELS.length)];
    }
  </script>
</body>
</html>
