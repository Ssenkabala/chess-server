.auth-input {

.auth-close {

<!-- ═══════════════════════════════════════════════
  STEP 4: Add this entire JS block inside your <script> tag,
  at the TOP before any other code
════════════════════════════════════════════════════ -->
<script>
// ═══════════════════════════════════════════════════════════════
//  SUPABASE AUTH + GAME SAVING
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL  = 'https://nbskgzsvygdmlvwbetxn.supabase.co';
const SUPABASE_ANON = 'sb_publishable_g5BEYnjhPatfmnHG3jNQTQ_fzgKOy4s';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let currentUser = null;
let authMode    = 'signin'; // 'signin' | 'signup'

// ── Init: check if already logged in ─────────────────────────
sb.auth.getSession().then(({ data }) => {
  if (data.session) setUser(data.session.user);
});

sb.auth.onAuthStateChange((event, session) => {
  if (session) setUser(session.user);
  else clearUser();
});

// ── User state ────────────────────────────────────────────────
function setUser(user) {
  currentUser = user;
  const email = user.email || 'Signed in';
  document.getElementById('user-info').innerHTML =
    'Signed in as <span>' + email + '</span>';
  document.getElementById('btn-login').style.display    = 'none';
  document.getElementById('btn-signout').style.display  = 'inline-block';
  document.getElementById('btn-history').style.display  = 'inline-block';
  closeAuth();
}

function clearUser() {
  currentUser = null;
  document.getElementById('user-info').innerHTML = 'Not signed in';
  document.getElementById('btn-login').style.display    = 'inline-block';
  document.getElementById('btn-signout').style.display  = 'none';
  document.getElementById('btn-history').style.display  = 'none';
}

// ── Auth modal ────────────────────────────────────────────────
function openAuth() {
  document.getElementById('auth-overlay').classList.add('active');
  document.getElementById('auth-error').textContent = '';
}

function closeAuth() {
  document.getElementById('auth-overlay').classList.remove('active');
}

function toggleAuthMode() {
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  const isSignIn = authMode === 'signin';
  document.getElementById('auth-title').textContent        = isSignIn ? 'Sign In' : 'Create Account';
  document.getElementById('auth-submit-btn').textContent   = isSignIn ? 'Sign In' : 'Create Account';
  document.getElementById('auth-toggle').innerHTML         = isSignIn
    ? 'No account? <span onclick="toggleAuthMode()">Create one</span>'
    : 'Already have one? <span onclick="toggleAuthMode()">Sign in</span>';
  document.getElementById('auth-error').textContent = '';
}

async function handleAuth() {
  const email    = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errorEl  = document.getElementById('auth-error');
  errorEl.textContent = '';

  if (!email || !password) {
    errorEl.textContent = 'Please enter email and password.';
    return;
  }

  const btn = document.getElementById('auth-submit-btn');
  btn.textContent = 'Please wait...';
  btn.disabled = true;

  let result;
  if (authMode === 'signin') {
    result = await sb.auth.signInWithPassword({ email, password });
  } else {
    result = await sb.auth.signUp({ email, password });
  }

  btn.disabled = false;
  btn.textContent = authMode === 'signin' ? 'Sign In' : 'Create Account';

  if (result.error) {
    errorEl.textContent = result.error.message;
  } else if (authMode === 'signup') {
    errorEl.style.color = '#00ff9d';
    errorEl.textContent = 'Check your email to confirm your account.';
  }
}

async function signInWithGoogle() {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin + '/play'
    }
  });
}

async function signOut() {
  await sb.auth.signOut();
  clearUser();
}

function goToHistory() {
  window.location.href = '/history';
}

// ── Game saving ───────────────────────────────────────────────
async function saveGame(pgn, result, playerColor) {
  if (!currentUser) return; // not logged in, skip silently

  const { error } = await sb.from('games').insert({
    user_id:      currentUser.id,
    pgn:          pgn,
    result:       result,
    player_color: playerColor,
    opponent:     'engine'
  });

  if (error) console.error('Game save failed:', error.message);
  else console.log('Game saved.');
}

// ── PGN builder from chess.js game ───────────────────────────
function buildPGN(chessGame, result) {
  // chess.js has a pgn() method built in
  return chessGame.pgn({ max_width: 80, newline_char: '\n' });
}
</script>


<!-- ═══════════════════════════════════════════════
  STEP 5: Replace your existing showResult() with this version
  It saves the game automatically when it ends
════════════════════════════════════════════════════ -->
<script>
function showResult() {
  var resultText, resultKey;

  if (game.in_checkmate()) {
    if (game.turn() === playerColor) {
      resultText = 'Engine wins by checkmate.';
      resultKey  = playerColor === 'w' ? 'black' : 'white';
    } else {
      resultText = 'You win by checkmate!';
      resultKey  = playerColor === 'w' ? 'white' : 'black';
    }
  } else if (game.in_draw()) {
    resultText = 'Game drawn.';
    resultKey  = 'draw';
  } else {
    resultText = 'Game over.';
    resultKey  = 'draw';
  }

  setStatus(resultText);

  // Save game if user is signed in
  var pgn = buildPGN(game, resultKey);
  var colorName = playerColor === 'w' ? 'white' : 'black';
  saveGame(pgn, resultKey, colorName);
}
</script>
