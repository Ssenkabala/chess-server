<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Africhess — My Games</title>
  <link rel="stylesheet" href="chessboard-1.0.0.min.css">
  <script src="jquery.min.js"></script>
  <script src="chessboard-1.0.0.min.js"></script>
  <script src="chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e8e6e0;
      font-family: 'Georgia', serif;
      min-height: 100vh;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #111;
      border-bottom: 1px solid #222;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: calc(100vh - 57px);
    }

    .game-list-panel {
      border-right: 1px solid #222;
      overflow-y: auto;
      background: #111;
    }
    .game-item {
      padding: 16px 20px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
      transition: background 0.2s;
    }
    .game-item:hover { background: #1a1a1a; }
    .game-item.active { background: #0f1a14; border-left: 3px solid #00ff9d; }

    .game-result-badge {
      padding: 2px 10px;
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .badge-win  { background: #00ff9d22; color: #00ff9d; }
    .badge-loss { background: #ff4d4d22; color: #ff6b6b; }
    .badge-draw { background: #5552; color: #aaa; }

    /* Replay Area */
    .replay-panel {
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #replay-board { width: 100%; max-width: 480px; }

    .replay-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .replay-btn {
      padding: 8px 16px;
      background: transparent;
      color: #00ff9d;
      border: 1px solid #00ff9d;
      cursor: pointer;
      border-radius: 2px;
    }

    .move-list-grid {
      display: grid;
      grid-template-columns: 40px 1fr 1fr;
      gap: 4px 12px;
      font-family: monospace;
      font-size: 13px;
      width: 100%;
      max-width: 480px;
    }
    .move-san { cursor: pointer; padding: 2px 6px; border-radius: 2px; }
    .move-san:hover { background: #222; }
    .move-san.current { background: #00ff9d22; color: #00ff9d; }

    .pgn-text {
      background: #161616;
      padding: 16px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-height: 180px;
      overflow-y: auto;
      width: 100%;
      max-width: 480px;
    }
  </style>
</head>
<body>

<div class="nav">
  <a href="/play" class="nav-logo">
    <img src="/logo.png" height="32" alt="AfriChess">
    <span>Afri<span style="color:#00ff9d">Chess</span></span>
  </a>
  <div>
    <button onclick="window.location.href='/play'" style="background:transparent;border:1px solid #00ff9d;color:#00ff9d;padding:6px 16px;border-radius:2px;">← Back to Play</button>
  </div>
</div>

<div class="layout">

  <!-- Game List -->
  <div class="game-list-panel" id="game-list">
    <div style="padding:20px; border-bottom:1px solid #222; font-size:13px; letter-spacing:1px; color:#666;">
      GAME HISTORY
    </div>
    <!-- Games populated by JS -->
  </div>

  <!-- Replay Panel -->
  <div class="replay-panel">
    <div id="replay-empty" style="text-align:center; color:#555; padding:60px 20px;">
      <div style="font-size:60px; margin-bottom:20px; opacity:0.3;">♟</div>
      <p>Select a game from the left to replay it</p>
    </div>

    <div id="replay-content" style="display:none; width:100%; max-width:480px;">
      <div id="replay-board"></div>

      <div class="replay-controls" style="margin:20px 0;">
        <button class="replay-btn" onclick="replayGoto(0)">⟪</button>
        <button class="replay-btn" onclick="replayPrev()">⟨</button>
        <span id="move-counter" style="min-width:80px; text-align:center; font-family:monospace;">0 / 0</span>
        <button class="replay-btn" onclick="replayNext()">⟩</button>
        <button class="replay-btn" onclick="replayGoto(999)">⟫</button>
        <button class="replay-btn" onclick="analyseCurrent()" style="margin-left:12px;">Analyse Position</button>
      </div>

      <div style="margin-top:20px;">
        <div style="font-size:11px; letter-spacing:1px; color:#555; margin-bottom:8px;">MOVES</div>
        <div id="move-list-grid" class="move-list-grid"></div>
      </div>

      <div style="margin-top:30px;">
        <div style="font-size:11px; letter-spacing:1px; color:#555; margin-bottom:8px;">PGN</div>
        <div id="pgn-text" class="pgn-text"></div>
        <button onclick="copyPGN()" style="margin-top:8px; padding:6px 14px; font-size:11px;">Copy PGN</button>
      </div>
    </div>
  </div>
</div>

<script>
// ========================= SUPABASE =========================
const SUPABASE_URL = 'https://nbskgzsvygdmlvwbetxn.supabase.co';
const SUPABASE_ANON = 'sb_publishable_g5BEYnjhPatfmnHG3jNQTQ_fzgKOy4s';
let sb;
let currentUser = null;

let games = [];
let replayGame = null;
let replayBoard = null;
let replayMoves = [];
let replayIdx = 0;
let activeGame = null;

async function init() {
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    const { data } = await sb.auth.getSession();
    if (data.session) {
      currentUser = data.session.user;
      loadGames();
    } else {
      document.getElementById('game-list').innerHTML = `
        <div style="padding:60px 20px; text-align:center; color:#666;">
          Please sign in to view your game history.
        </div>`;
    }
  } catch(e) {
    console.error(e);
  }
}

async function loadGames() {
  const { data, error } = await sb
    .from('games')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });

  if (error || !data) return;

  games = data;
  renderGameList();
}

function renderGameList() {
  const container = document.getElementById('game-list');
  container.innerHTML = `<div style="padding:20px; border-bottom:1px solid #222; font-size:13px; letter-spacing:1px; color:#666;">GAME HISTORY</div>`;

  games.forEach(game => {
    const isWin = game.result === game.player_color;
    const isDraw = game.result === 'draw';

    const div = document.createElement('div');
    div.className = 'game-item';
    div.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span class="game-result-badge ${isWin ? 'badge-win' : isDraw ? 'badge-draw' : 'badge-loss'}">
          ${isWin ? 'WIN' : isDraw ? 'DRAW' : 'LOSS'}
        </span>
        <span style="font-size:11px; color:#555;">${new Date(game.created_at).toLocaleDateString()}</span>
      </div>
      <div style="font-size:13px; color:#aaa;">
        ${game.player_color === 'white' ? 'White' : 'Black'} vs ${formatOpponent(game.opponent)}
      </div>
    `;
    div.onclick = () => openReplay(game);
    container.appendChild(div);
  });
}

function formatOpponent(op) {
  if (!op) return "Engine";
  if (op.startsWith('engine_lvl_')) return `Engine (Lvl ${op.slice(11)})`;
  if (op.startsWith('human:')) return op.replace('human:', '');
  return op;
}

function openReplay(game) {
  activeGame = game;
  document.getElementById('replay-empty').style.display = 'none';
  document.getElementById('replay-content').style.display = 'block';

  replayGame = new Chess();
  replayGame.load_pgn(game.pgn || '');
  replayMoves = replayGame.history({verbose: true});

  if (replayBoard) replayBoard.destroy();

  replayBoard = Chessboard('replay-board', {
    position: 'start',
    orientation: game.player_color || 'white',
    draggable: false
  });

  replayIdx = 0;
  renderMoveList();
  updateReplayBoard();
}

function renderMoveList() {
  const grid = document.getElementById('move-list-grid');
  grid.innerHTML = '';

  for (let i = 0; i < replayMoves.length; i += 2) {
    // Move number
    const num = document.createElement('div');
    num.style.color = '#555';
    num.textContent = `${Math.floor(i/2) + 1}.`;
    grid.appendChild(num);

    // White move
    const w = document.createElement('div');
    w.className = 'move-san';
    w.textContent = replayMoves[i] ? replayMoves[i].san : '';
    w.onclick = () => replayGoto(i + 1);
    grid.appendChild(w);

    // Black move
    const b = document.createElement('div');
    b.className = 'move-san';
    b.textContent = replayMoves[i+1] ? replayMoves[i+1].san : '';
    b.onclick = () => replayGoto(i + 2);
    grid.appendChild(b);
  }
}

function replayGoto(idx) {
  replayIdx = Math.min(Math.max(0, idx), replayMoves.length);
  const tempGame = new Chess();
  for (let i = 0; i < replayIdx; i++) {
    tempGame.move(replayMoves[i]);
  }
  replayBoard.position(tempGame.fen());
  updateReplayBoard();
}

function replayPrev() { if (replayIdx > 0) replayGoto(replayIdx - 1); }
function replayNext() { if (replayIdx < replayMoves.length) replayGoto(replayIdx + 1); }

function updateReplayBoard() {
  document.getElementById('move-counter').textContent = `${replayIdx} / ${replayMoves.length}`;
}

function analyseCurrent() {
  if (!activeGame) return;
  const tempGame = new Chess();
  for (let i = 0; i < replayIdx; i++) tempGame.move(replayMoves[i]);
  const fen = tempGame.fen();
  window.location.href = `/play?analyse=${encodeURIComponent(fen)}`;
}

function copyPGN() {
  if (!activeGame) return;
  navigator.clipboard.writeText(activeGame.pgn || '').then(() => {
    alert('PGN copied to clipboard!');
  });
}

// Boot
window.onload = init;
</script>
</body>
</html>
