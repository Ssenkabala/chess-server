<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Africhess</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Georgia', serif;
      color: #e8e6e0;
      gap: 16px;
      padding: 16px;
    }

    .top-bar {
      width: 100%;
      max-width: 520px;
      padding: 4px 0 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: #888;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      gap: 0;
      border: 1px solid #333;
      border-radius: 2px;
      overflow: hidden;
    }
    .tab-btn {
      padding: 9px 28px;
      background: transparent;
      color: #666;
      border: none;
      border-right: 1px solid #333;
      font-size: 13px;
      font-family: 'Georgia', serif;
      letter-spacing: 0.12em;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .tab-btn:last-child { border-right: none; }
    .tab-btn:hover { color: #00ff9d; background: #1a1a1a; }
    .tab-btn.active { background: #00ff9d22; color: #00ff9d; }

    .panel { display: none; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 520px; }
    .panel.active { display: flex; }

    #board, #analysis-board { width: 100%; max-width: 480px; }

    .highlight-square { background: radial-gradient(circle, rgba(0,255,157,0.55) 25%, transparent 27%) !important; }
    .highlight-capture { background: radial-gradient(circle, transparent 55%, rgba(0,255,157,0.55) 57%) !important; }
    .highlight-selected { background: rgba(0,255,157,0.2) !important; }
    .highlight-best { background: rgba(0,255,157,0.35) !important; box-shadow: inset 0 0 0 3px #00ff9d88; }

    #status, #analysis-status {
      font-size: 16px;
      color: #aaa;
      letter-spacing: 0.05em;
      min-height: 24px;
      text-align: center;
    }

    button {
      padding: 10px 24px;
      background: transparent;
      color: #00ff9d;
      border: 1px solid #00ff9d;
      font-size: 14px;
      font-family: 'Georgia', serif;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }
    button:hover, button.active { background: #00ff9d; color: #111; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    .user-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }
    .user-info { font-size: 11px; color: #555; letter-spacing: 0.08em; font-family: monospace; }
    .user-info span { color: #00ff9d; }

    /* Auth Modal */
    .auth-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(4px);
    }
    .auth-overlay.active { display: flex !important; }

    .auth-card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-top: 2px solid #00ff9d;
      border-radius: 3px;
      padding: 36px 40px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-title { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #00ff9d; }
    .auth-input {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      color: #e8e6e0;
      padding: 11px 14px;
      font-size: 13px;
      font-family: monospace;
      border-radius: 2px;
      outline: none;
    }
    .auth-input:focus { border-color: #00ff9d55; }
    .auth-btn {
      width: 100%;
      padding: 12px;
      background: #00ff9d;
      color: #111;
      border: none;
      font-size: 12px;
      font-family: 'Georgia', serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
    }
    .auth-btn:hover { background: #00cc7a; }

    .username-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
    }
    .username-overlay.active { display: flex; }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="/" class="top-logo">
      <img src="/logo.png" height="32" alt="AfriChess">
      <span>Afri<span style="color:#00d98b">Chess</span></span>
    </a>
    <button class="hamburger" id="hamburger" onclick="toggleMobileMenu()">☰</button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" id="mobile-menu" style="display:none; flex-direction:column; gap:12px; padding:20px; background:#111; width:100%; max-width:520px;">
    <button onclick="window.location.href='/'">Home</button>
    <button onclick="window.location.href='/multiplayer'">Play Live</button>
    <button onclick="window.location.href='/history'">My Games</button>
    <button onclick="toggleMobileMenu(); openAuth()">Sign In</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(0)">Play</button>
    <button class="tab-btn" onclick="switchTab(1)">Analysis</button>
  </div>

  <!-- PLAY PANEL -->
  <div id="panel-play" class="panel active">
    <div id="status">Choose your color to begin.</div>

    <div style="display:flex; align-items:center; gap:12px; font-size:12px; color:#555;">
      <span>Difficulty</span>
      <div style="display:flex; border:1px solid #333;">
        <button class="diff-btn active" data-diff="1" onclick="setDifficulty(1,this)">1</button>
        <button class="diff-btn" data-diff="2" onclick="setDifficulty(2,this)">2</button>
        <button class="diff-btn" data-diff="3" onclick="setDifficulty(3,this)">3</button>
        <button class="diff-btn" data-diff="4" onclick="setDifficulty(4,this)">4</button>
        <button class="diff-btn" data-diff="5" onclick="setDifficulty(5,this)">5</button>
      </div>
    </div>

    <div class="user-bar">
      <div class="user-info" id="user-info">Not signed in</div>
      <div>
        <button onclick="openAuth()" id="btn-login">Sign In</button>
        <button onclick="signOut()" id="btn-signout" style="display:none">Sign Out</button>
        <button onclick="goToHistory()" id="btn-history" style="display:none">My Games</button>
      </div>
    </div>

    <div class="controls">
      <button id="btn-white" onclick="startGame('white')">Play as White</button>
      <button id="btn-black" onclick="startGame('black')">Play as Black</button>
    </div>

    <div id="board" style="display:none;"></div>

    <div class="controls" id="game-controls" style="display:none;">
      <button onclick="resign()">Resign</button>
      <button onclick="newGame()">New Game</button>
    </div>
  </div>

  <!-- ANALYSIS PANEL -->
  <div id="panel-analysis" class="panel">
    <input type="text" id="fen-input" placeholder="Paste FEN here" style="width:480px;padding:10px;">
    <div class="controls">
      <button onclick="loadFen()">Load FEN</button>
      <button onclick="analysePosition()">Analyse</button>
      <button id="btn-coach" onclick="getCoaching()">Coach Me</button>
    </div>
    <div id="analysis-board"></div>
    <div id="analysis-status"></div>
    <!-- Coach card and candidates would go here (same as original) -->
  </div>

  <!-- Auth Modal -->
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-card">
      <button onclick="closeAuth()" style="position:absolute;top:10px;right:15px;background:none;border:none;color:#666;font-size:24px;cursor:pointer;">×</button>
      <div class="auth-title" id="auth-title">Sign In</div>
      <input class="auth-input" id="auth-email" type="email" placeholder="Email">
      <input class="auth-input" id="auth-password" type="password" placeholder="Password">
      <div class="auth-error" id="auth-error"></div>
      <button class="auth-btn" id="auth-submit-btn" onclick="handleAuth()">Sign In</button>
      <button class="auth-btn" onclick="signInWithGoogle()" style="background:#4285F4;color:white;">Continue with Google</button>
    </div>
  </div>

<script>
// ==================== CORE GAME LOGIC ====================
let currentDifficulty = 3;
let game = new Chess();
let board = null;
let playerColor = 'w';
let moveHistory = [];

// Supabase
const SUPABASE_URL = 'https://nbskgzsvygdmlvwbetxn.supabase.co';
const SUPABASE_ANON = 'sb_publishable_g5BEYnjhPatfmnHG3jNQTQ_fzgKOy4s';
let sb, currentUser = null;

function initSupabase() {
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    sb.auth.getSession().then(({ data }) => {
      if (data.session) setUser(data.session.user);
    });
  } catch(e) {}
}

function setUser(user) {
  currentUser = user;
  document.getElementById('user-info').innerHTML = `<span>${user.email}</span>`;
  document.getElementById('btn-login').style.display = 'none';
  document.getElementById('btn-signout').style.display = 'inline-block';
  document.getElementById('btn-history').style.display = 'inline-block';
}

async function saveGame() {
  if (!currentUser || !sb) return;
  const pgn = game.pgn();
  const result = game.in_checkmate() ? (game.turn() === 'w' ? 'black' : 'white') : 
                 game.in_draw() ? 'draw' : 'unknown';

  await sb.from('games').insert({
    user_id: currentUser.id,
    pgn: pgn,
    result: result,
    player_color: playerColor === 'w' ? 'white' : 'black',
    opponent: `engine_lvl_${currentDifficulty}`
  });
}

// ==================== PLAY FUNCTIONS ====================
function startGame(color) {
  playerColor = color === 'white' ? 'w' : 'b';
  game = new Chess();
  moveHistory = [];

  document.getElementById('board').style.display = 'block';
  document.getElementById('game-controls').style.display = 'flex';

  board = Chessboard('board', {
    draggable: true,
    position: 'start',
    orientation: playerColor,
    onDrop: onDrop,
    pieceTheme: 'img/chesspieces/wikipedia/{piece}.png'
  });
}

function onDrop(source, target) {
  const move = game.move({from: source, to: target, promotion: 'q'});
  if (!move) return 'snapback';

  board.position(game.fen());
  moveHistory.push(move.san);

  if (game.game_over()) {
    setTimeout(() => {
      alert(game.in_checkmate() ? "Checkmate!" : "Draw!");
      saveGame();
    }, 300);
    return;
  }

  // Engine move
  setTimeout(engineMove, 300);
}

async function engineMove() {
  // Call /move endpoint with current difficulty
  const res = await fetch('/move', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ fen: game.fen(), difficulty: currentDifficulty })
  });
  const data = await res.json();

  if (data.move) {
    game.move(data.move, {sloppy: true});
    board.position(game.fen());
  }

  if (game.game_over()) {
    saveGame();
  }
}

// ==================== AUTH ====================
function openAuth() { document.getElementById('auth-overlay').classList.add('active'); }
function closeAuth() { document.getElementById('auth-overlay').classList.remove('active'); }

async function handleAuth() {
  // ... (full auth logic from previous version)
}

async function signOut() {
  if (sb) await sb.auth.signOut();
  currentUser = null;
  document.getElementById('user-info').textContent = 'Not signed in';
  document.getElementById('btn-login').style.display = 'inline-block';
  document.getElementById('btn-signout').style.display = 'none';
}

function goToHistory() {
  window.location.href = '/history';
}

// Tab switching
function switchTab(n) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-play').classList.toggle('active', n === 0);
  document.getElementById('panel-analysis').classList.toggle('active', n === 1);
  document.querySelectorAll('.tab-btn')[n].classList.add('active');
}

// Mobile menu
function toggleMobileMenu() {
  const menu = document.getElementById('mobile-menu');
  menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  initSupabase();
  switchTab(0);
});
</script>
</body>
</html>
