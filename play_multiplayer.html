  <!-- Set zoom CSS variable BEFORE any style renders -->
  <script>
    (function() {
      var saved = parseInt(localStorage.getItem('africhess.zoom') || '', 10);
      var zoom;
      if (saved >= 0 && saved <= 100) {
        zoom = saved;
      } else {
        var vw = Math.min(screen.width, window.innerWidth || screen.width);
        zoom = Math.round(Math.min(100, Math.max(0, (vw - 32 - 200) / 3)));
      }
      document.documentElement.style.setProperty('---zoom', zoom.toString());
    })();
  </script>

  <style>
.cg-wrap {
  box-sizing: content-box;
  position: relative;
  display: block;
}

cg-container {
  position: absolute;
  width: 100%;
  height: 100%;
  display: block;
  top: 0;
}

cg-board {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  line-height: 0;
  background-size: cover;
}

.cg-wrap.manipulable cg-board {
  cursor: pointer;
}

cg-board square {
  position: absolute;
  top: 0;
  left: 0;
  width: 12.5%;
  height: 12.5%;
  pointer-events: none;
}

cg-board square.move-dest {
  pointer-events: auto;
}

cg-board square.last-move {
  will-change: transform;
}

.cg-wrap piece {
  position: absolute;
  top: 0;
  left: 0;
  width: 12.5%;
  height: 12.5%;
  background-size: cover;
  z-index: 2;
  will-change: transform;
  pointer-events: none;
}

cg-board piece.dragging {
  cursor: move;
  /* !important to override z-index from 3D piece inline style */
  z-index: 11 !important;
}

piece.anim {
  z-index: 8;
}

piece.fading {
  z-index: 1;
  opacity: 0.5;
}

.cg-wrap piece.ghost {
  opacity: 0.3;
}

.cg-wrap piece svg {
  overflow: hidden;
  position: relative;
  top: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
  opacity: 0.6;
}

.cg-wrap cg-auto-pieces,
.cg-wrap .cg-shapes,
.cg-wrap .cg-custom-svgs {
  overflow: visible;
  position: absolute;
  top: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.cg-wrap cg-auto-pieces {
  z-index: 2;
}

.cg-wrap cg-auto-pieces piece {
  opacity: 0.3;
}

.cg-wrap .cg-shapes {
  overflow: hidden;
  opacity: 0.6;
  z-index: 2;
}

.cg-wrap .cg-custom-svgs {
  /* over piece.anim = 8, but under piece.dragging = 11 */
  z-index: 9;
}

.cg-wrap .cg-custom-svgs svg {
  overflow: visible;
}

.cg-wrap coords {
  position: absolute;
  display: flex;
  pointer-events: none;
  opacity: 0.8;
  font-family: sans-serif;
  font-size: 9px;
}

.cg-wrap coords.ranks {
  left: 4px;
  top: -20px;
  flex-flow: column-reverse;
  height: 100%;
  width: 12px;
}

.cg-wrap coords.ranks.black {
  flex-flow: column;
}

.cg-wrap coords.ranks.left {
  left: -15px;
  align-items: flex-end;
}

.cg-wrap coords.files {
  bottom: -4px;
  left: 24px;
  flex-flow: row;
  width: 100%;
  height: 16px;
  text-transform: uppercase;
  text-align: center;
}

.cg-wrap coords.files.black {
  flex-flow: row-reverse;
}

.cg-wrap coords coord {
  flex: 1 1 auto;
}

.cg-wrap coords.ranks coord {
  transform: translateY(39%);
}

.cg-wrap coords.squares {
  bottom: 0;
  left: 0;
  text-transform: uppercase;
  text-align: right;
  flex-flow: column-reverse;
  height: 100%;
  width: 12.5%;
}

.cg-wrap coords.squares.black {
  flex-flow: column;
}

.cg-wrap coords.squares.left {
  text-align: left;
}

.cg-wrap coords.squares coord {
  padding: 6% 4%;
}

.cg-wrap coords.squares.rank2 {
  transform: translateX(100%);
}

.cg-wrap coords.squares.rank3 {
  transform: translateX(200%);
}

.cg-wrap coords.squares.rank4 {
  transform: translateX(300%);
}

.cg-wrap coords.squares.rank5 {
  transform: translateX(400%);
}

.cg-wrap coords.squares.rank6 {
  transform: translateX(500%);
}

.cg-wrap coords.squares.rank7 {
  transform: translateX(600%);
}

.cg-wrap coords.squares.rank8 {
  transform: translateX(700%);
}

/** Interactive board square colors */
cg-board square.move-dest {
  background: radial-gradient(rgba(20, 85, 30, 0.5) 22%, #208530 0, rgba(0, 0, 0, 0.3) 0, rgba(0, 0, 0, 0) 0);
}
cg-board square.premove-dest {
  background: radial-gradient(rgba(20, 30, 85, 0.5) 22%, #203085 0, rgba(0, 0, 0, 0.3) 0, rgba(0, 0, 0, 0) 0);
}
cg-board square.oc.move-dest {
  background: radial-gradient(transparent 0%, transparent 80%, rgba(20, 85, 0, 0.3) 80%);
}
cg-board square.oc.premove-dest {
  background: radial-gradient(transparent 0%, transparent 80%, rgba(20, 30, 85, 0.2) 80%);
}
cg-board square.move-dest:hover {
  background: rgba(20, 85, 30, 0.3);
}
cg-board square.premove-dest:hover {
  background: rgba(20, 30, 85, 0.2);
}
cg-board square.last-move {
  background-color: rgba(155, 199, 0, 0.41);
}
cg-board square.selected {
  background-color: rgba(20, 85, 30, 0.5);
}
cg-board square.check {
  background: radial-gradient(
    ellipse at center,
    rgba(255, 0, 0, 1) 0%,
    rgba(231, 0, 0, 1) 25%,
    rgba(169, 0, 0, 0) 89%,
    rgba(158, 0, 0, 0) 100%
  );
}
cg-board square.current-premove {
  background-color: rgba(20, 30, 85, 0.5);
}

/** Alternating colors in rank/file/square labels */
.orientation-white .ranks :nth-child(odd),
.orientation-white .files :nth-child(even),
.orientation-black .ranks :nth-child(even),
.orientation-black .files :nth-child(odd),
coords.squares:nth-of-type(odd) :nth-child(even),
coords.squares:nth-of-type(even) :nth-child(odd) {
  color: rgba(72, 72, 72, 0.8);
}

.orientation-white .ranks :nth-child(even),
.orientation-white .files :nth-child(odd),
.orientation-black .ranks :nth-child(odd),
.orientation-black .files :nth-child(even),
coords.squares:nth-of-type(odd) :nth-child(odd),
coords.squares:nth-of-type(even) :nth-child(even) {
  color: rgba(255, 255, 255, 0.8);
}

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #00ff9d;
      --green2:  #00cc7a;
      --bg:      #0d0d0d;
      --bg2:     #161616;
      --bg3:     #1e1e1e;
      --border:  #2a2a2a;
      --text:    #e8e6e0;
      --muted:   #666;
      --danger:  #ff4d4d;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Georgia', serif;
      color: var(--text);
      padding: 24px 16px;
      gap: 0;
    }

    /* ── Header ── */
    .header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 18px;
      letter-spacing: 0.2em;
      color: var(--green);
      text-transform: uppercase;
      text-decoration: none;
    }
    .header-right {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* ── Screens ── */
    .screen { display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 520px; }
    .screen.active { display: flex; }

    /* ── Lobby screen ── */
    .lobby-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 48px 40px;
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .lobby-title {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .lobby-status {
      font-size: 20px;
      color: var(--text);
      letter-spacing: 0.05em;
    }

    /* Pulsing dots */
    .dots {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1.1); }
    }

    .guest-id {
      font-size: 11px;
      color: #444;
      font-family: monospace;
      letter-spacing: 0.1em;
    }

    /* ── Game screen ── */
    .game-wrap {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Player bar */
    .player-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 3px;
    }
    .player-name {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .player-name.active-turn { color: var(--green); }

    .clock {
      font-family: monospace;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: var(--text);
      min-width: 60px;
      text-align: right;
    }
    .clock.low { color: var(--danger); animation: flash 1s step-end infinite; }
    @keyframes flash { 50% { opacity: 0.4; } }
    .clock.active-clock { color: var(--green); }

    /* Board — zoom CSS variable (shared with index.html via localStorage) */
    :root { ---zoom: 80; }
    #board-wrap {
      display: block; position: relative; touch-action: none;
      width:  calc(200px + var(---zoom) * 3px);
      height: calc(200px + var(---zoom) * 3px);

function tcCategory(tc) {
  if (!tc) return 'Blitz';
  try {
    const parts = tc.split('+');
    const base = parseFloat(parts[0]);
    const inc  = parts[1] ? parseFloat(parts[1]) : 0;
    const equiv = base + (40 * inc / 60);
    if (equiv < 3)   return 'Bullet';
    if (equiv < 10)  return 'Blitz';
    if (equiv <= 15) return 'Rapid';
    return 'Classical';
  } catch { return ''; }
}

function selectTc(btn) {
  document.querySelectorAll('.tc-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const tc = btn.getAttribute('data-tc');
  window._timeControl = tc;
  const label = document.getElementById('tc-label');
  if (label) label.textContent = tc + ' · ' + tcCategory(tc);
}

// ── Board resize (zoom CSS variable — mirrors Lichess approach) ───────────────
var ZOOM_STORAGE = 'africhess.zoom';

function initBoardZoom() {
  var saved = parseInt(localStorage.getItem(ZOOM_STORAGE) || '', 10);
  if (saved >= 0 && saved <= 100) {
    document.body.style.setProperty('---zoom', saved.toString());
  } else {
    var vw = Math.min(window.innerWidth, window.screen.width);
    var defaultZoom = Math.round(Math.min(100, Math.max(0, (vw - 200) / 3)));
    document.body.style.setProperty('---zoom', defaultZoom.toString());
  }
}

function makeBoardResizable(wrapId, cgGetter) {
  var wrap = document.getElementById(wrapId);
  if (!wrap) return;
  var old = wrap.querySelector('cg-resize');
  if (old) old.remove();
  var container = wrap.querySelector('cg-container') || wrap;
  var handle = document.createElement('cg-resize');
  container.appendChild(handle);

  function getPos(e) {
    if (e.clientX !== undefined) return [e.clientX, e.clientY];
    if (e.targetTouches && e.targetTouches[0])
      return [e.targetTouches[0].clientX, e.targetTouches[0].clientY];
  }
  function onDragStart(e) {
    e.preventDefault();
    var startPos  = getPos(e);
    var startZoom = parseInt(window.getComputedStyle(document.body).getPropertyValue('---zoom').trim() || '80', 10);
    var moveEv = e.type === 'touchstart' ? 'touchmove' : 'mousemove';
    var upEv   = e.type === 'touchstart' ? 'touchend'  : 'mouseup';
    document.body.classList.add('resizing');
    function onMove(ev) {
      var pos   = getPos(ev);
      var delta = (pos[0] - startPos[0] + pos[1] - startPos[1]) / 10;
      var zoom  = Math.round(Math.min(100, Math.max(0, startZoom + delta)));
      document.body.style.setProperty('---zoom', zoom.toString());
      window.dispatchEvent(new Event('resize'));
      document.body.dispatchEvent(new Event('chessground.resize'));
      var cgInst = cgGetter();
      if (cgInst) cgInst.redrawAll();
    }
    function onUp() {
      document.removeEventListener(moveEv, onMove);
      document.removeEventListener(upEv, onUp);
      document.body.classList.remove('resizing');
      var z = parseInt(window.getComputedStyle(document.body).getPropertyValue('---zoom').trim() || '80', 10);
      localStorage.setItem(ZOOM_STORAGE, z);
    }
    document.addEventListener(moveEv, onMove);
    document.addEventListener(upEv, onUp);
  }
  handle.addEventListener('mousedown',  onDragStart, { passive: false });
  handle.addEventListener('touchstart', onDragStart, { passive: false });
}

  // Check for Arena tournament game_id in URL

function toDests() {
  if (!myTurn || gameOver) return new Map();
  const dests = new Map();
  game.moves({ verbose: true }).forEach(m => {
    if (!dests.has(m.from)) dests.set(m.from, []);
    dests.get(m.from).push(m.to);
  });
  return dests;
}

function refreshDests() {
  if (!cg) return;
  if (cg) cg.set({
    movable: { color: myColor, dests: toDests() },
    turnColor: game.turn() === 'w' ? 'white' : 'black',
    check: game.in_check(),
  });
}

  setLobbyStatus('Connecting...');
  lobbyWs = new WebSocket(WS_BASE + '/ws/lobby');

  lobbyWs.onopen = () => {
    setLobbyStatus('Searching for ' + (window._timeControl || '5+0') + ' game...');
    // Send preferred time control so server can match by TC in future
    lobbyWs.send(JSON.stringify({ type: 'time_control', tc: window._timeControl || '5+0' }));
    lobbyWs._ping = setInterval(() => {
      if (lobbyWs && lobbyWs.readyState === WebSocket.OPEN) {
        lobbyWs.send(JSON.stringify({ type: 'ping' }));
      }
    }, 20000);
  };

  lobbyWs.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'waiting') {
      myId = msg.guest_id;
      document.getElementById('guest-label').textContent = myId;
      setLobbyStatus('Searching for ' + (window._timeControl || '5+0') + ' game...');
    }

    if (msg.type === 'matched') {
      gameId   = msg.game_id;
      myColor  = msg.color;
      // Server may confirm the time control used
      if (msg.time_control) window._timeControl = msg.time_control;
      setLobbyStatus('Opponent found! Starting game...');
      setTimeout(() => startGame(), 400);
    }
  };

  lobbyWs.onclose = () => {
    if (lobbyWs && lobbyWs._ping) clearInterval(lobbyWs._ping);
    if (!gameId) setLobbyStatus('Connection lost. Retrying...');
  };

  lobbyWs.onerror = () => setLobbyStatus('Connection error. Check server.');
}

function setLobbyStatus(msg) {
  const el = document.getElementById('lobby-status');
  if (el) el.textContent = msg;
}

function cancelLobby() {
  if (lobbyWs) lobbyWs.close();
  gameId = null;
  // Go back to picker, not home
  document.getElementById('tc-picker').style.display = '';
  document.getElementById('tc-searching').style.display = 'none';
}
// Prevent page scroll when dragging pieces on mobile
document.addEventListener('DOMContentLoaded', function() {
  var boardEl = document.getElementById('board');
  if (!boardEl) return;

  // Prevent scroll while touching board
  boardEl.addEventListener('touchmove', function(e) {
    e.preventDefault();
  }, { passive: false });

  // Native tap-to-move using data-square attribute
  var touchStartX, touchStartY;
  boardEl.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  boardEl.addEventListener('touchend', function(e) {
    var dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
    var dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if (dx > 10 || dy > 10) return; // swipe, not tap — chessground handles drag natively
    // Tap-to-move is handled natively by chessground — no manual square click needed
  }, { passive: false });
});

// ═══════════════════════════════════════════════════════════════
//  GAME INIT
// ═══════════════════════════════════════════════════════════════
function startGame() {
  showScreen('game');
  game     = new Chess();
  gameOver = false;
  myTurn   = myColor === 'white';

  // Player labels
  const opponentColor = myColor === 'white' ? 'black' : 'white';
  const myName = myProfile ? myProfile.username : myId;
  const myElo  = myProfile ? myProfile.elo : null;
  document.getElementById('name-me').textContent = myName + ' (' + myColor + ')';
  if (myElo) {
    document.getElementById('name-me').innerHTML =
      '<strong>' + myName + '</strong> <span style="font-size:11px;color:#444;">' + myElo + ' ELO</span> (' + myColor + ')';
  }
  document.getElementById('name-opponent').textContent = 'Opponent (' + opponentColor + ')';

  // Apply saved zoom (shared with index.html)
  var savedZoom = parseInt(localStorage.getItem('africhess.zoom') || '', 10);
  if (savedZoom >= 0 && savedZoom <= 100)
    document.body.style.setProperty('---zoom', savedZoom.toString());

  // Chessground init — board-wrap sized by CSS zoom variable, no JS sizing needed
  if (cg) { cg.destroy(); cg = null; }
  cg = Chessground(document.getElementById('board'), {
    orientation: myColor,
    fen: 'start',
    turnColor: 'white',
    movable: {
      color: myColor, free: false, dests: toDests(),
      events: { after: afterMove }
    },
    draggable: { enabled: true },
    selectable: { enabled: true },
    animation: { enabled: true, duration: 120 },
    highlight: { lastMove: true, check: true },
    coordinates: true,
  });

  // Add resize handle (same zoom variable as vs-engine board)
  makeBoardResizable('board-wrap', function() { return cg; });

  resetClockDisplay();
  updateTurnIndicator();
  startClockTick();

  // Connect game websocket after board is ready
  gameWs = new WebSocket(WS_BASE + '/ws/game/' + gameId);
  gameWs.onopen = () => {
    // Close lobby socket ONLY after game socket is confirmed open
    if (lobbyWs) { lobbyWs.close(); lobbyWs = null; }

    // First: claim our color slot so server assigns correctly
    gameWs.send(JSON.stringify({ type: 'claim', color: myColor }));

    // Send profile so server can share with opponent and calculate ELO
    if (myProfile && currentUser) {
      gameWs.send(JSON.stringify({
        type:         'profile',
        username:     myProfile.username,
        elo:          myProfile.elo,
        user_id:      currentUser.id,
        time_control: window._timeControl || null,
      }));
    }
    // Keepalive — Railway kills idle connections after ~30s
    gameWs._ping = setInterval(() => {
      if (gameWs && gameWs.readyState === WebSocket.OPEN) {
        gameWs.send(JSON.stringify({ type: 'ping' }));
      }
    }, 20000);
  };
  gameWs.onmessage = onGameMessage;
  gameWs.onclose   = () => {
    if (gameWs && gameWs._ping) clearInterval(gameWs._ping);
    if (!gameOver) showGameStatus('Connection lost.');
  };

  document.getElementById('move-list').innerHTML = '';
  document.getElementById('overlay').classList.remove('active');
}

// ═══════════════════════════════════════════════════════════════
//  WEBSOCKET MESSAGES
// ═══════════════════════════════════════════════════════════════
function onGameMessage(e) {
  const msg = JSON.parse(e.data);

  // Keepalive — ignore pings from server
  if (msg.type === 'ping' || msg.type === 'pong') return;

  if (msg.type === 'opponent_profile') {
    opponentUsername = msg.username;
    const opColor = myColor === 'white' ? 'black' : 'white';
    document.getElementById('name-opponent').innerHTML =
      '<strong>' + msg.username + '</strong>' +
      (msg.elo ? ' <span style="font-size:11px;color:#444;">' + msg.elo + ' ELO</span>' : '') +
      ' (' + opColor + ')';
    return;
  }

  if (msg.type === 'elo_update') {
    const change = msg.new_elo - msg.old_elo;
    const sign   = change >= 0 ? '+' : '';
    const color  = change >= 0 ? '#00ff9d' : '#ff4d4d';
    const cat    = msg.category || 'Blitz';
    const el     = document.getElementById('result-reason');
    if (el) el.innerHTML += ` <span style="color:${color};font-size:12px;">(${sign}${change} ${cat} ELO · now ${msg.new_elo})</span>`;
    myEloChange = change;
    if (myProfile) {
      myProfile.eloBefore = msg.old_elo;
      myProfile.elo = msg.new_elo;
    }
    return;
  }

  if (msg.type === 'draw_offer') {
    // Show draw offer inline — don't use confirm() which blocks the thread
    showGameStatus('Opponent offers a draw!', true);
    const area = document.getElementById('rematch-area');
    if (area && !document.getElementById('btn-accept-draw')) {
      const btn = document.createElement('button');
      btn.id = 'btn-accept-draw';
      btn.textContent = 'Accept Draw';
      btn.onclick = () => {
        sendGame({ type: 'draw_accept' });
        btn.remove();
      };
      area.querySelector('.controls').prepend(btn);
    }
    return;
  }

  if (msg.type === 'clock') {
    clocks.white = msg.white;
    clocks.black = msg.black;
    renderClocks();
  }

  if (msg.type === 'gameover') {
    gameOver = true;
    stopClockTick();
    showOverlay(msg.result, msg.reason);
  }

  if (msg.type === 'both_connected') {
    showGameStatus('Game started!', true);
    setTimeout(() => updateTurnIndicator(), 500);
    // If white, show first-move deadline warning
    if (myColor === 'white' && msg.first_move_timeout) {
      const secs = msg.first_move_timeout;
      let remaining = secs;
      const warn = setInterval(() => {
        remaining--;
        if (remaining <= 10 && remaining > 0) {
          showGameStatus(`Make your first move! ${remaining}s remaining…`, true);
        }
        if (remaining <= 0) clearInterval(warn);
      }, 1000);
      // Clear warning once a move is made
      window._firstMoveWarn = warn;
    }
    return;
  }

  if (msg.type === 'error') {
    showGameStatus('⚠ ' + msg.detail);
  }
  if (msg.type === 'move') {
    game.load(msg.fen);
    if (cg) cg.set({ fen: msg.fen, lastMove: msg.move ? [msg.move.slice(0,2), msg.move.slice(2,4)] : undefined });
    highlightLastMove(msg.move);
    updateClocks(msg.clock);
    myTurn = msg.turn === myColor;
    updateTurnIndicator();
    refreshDests();
    multiMoveHistory.push(msg.move);
    appendMove(msg.move);
  }
  if (msg.type === 'rematch_offer') {
    document.getElementById('rematch-status').textContent = 'Opponent wants a rematch!';
    document.getElementById('btn-rematch').textContent = 'Accept';
    document.getElementById('btn-rematch').onclick = () => {
      sendGame({ type: 'rematch_accept' });
      document.getElementById('rematch-status').textContent = 'Starting rematch...';
      document.getElementById('btn-rematch').disabled = true;
    };
    // Add decline button
    const area = document.getElementById('rematch-area').querySelector('.controls');
    if (!document.getElementById('btn-decline')) {
      const btn = document.createElement('button');
      btn.id = 'btn-decline'; btn.className = 'danger';
      btn.textContent = 'Decline';
      btn.onclick = () => { sendGame({ type: 'rematch_decline' }); goToLobby(); };
      area.insertBefore(btn, area.children[1]);
    }
  }

  if (msg.type === 'rematch_declined') {
    document.getElementById('rematch-status').textContent = 'Opponent declined.';
    document.getElementById('btn-rematch').disabled = true;
  }

  if (msg.type === 'rematch_start') {
    if (gameWs) { gameWs.onclose = null; gameWs.close(); gameWs = null; }

    gameId   = msg.game_id;
    myColor  = msg.color;
    gameOver = false;
    document.getElementById('overlay').classList.remove('active');

    game = new Chess();
        myTurn = myColor === 'white';
    document.getElementById('move-list').innerHTML = '';
    resetClockDisplay();

    const rwrap = document.getElementById('board-wrap');
    if (cg) { cg.destroy(); cg = null; }
    cg = Chessground(document.getElementById('board'), {
      orientation: myColor, fen: 'start', turnColor: 'white',
      movable: { color: myColor, free: false, dests: toDests(), events: { after: afterMove } },
      draggable: { enabled: true }, selectable: { enabled: true },
      animation: { enabled: true, duration: 120 },
      highlight: { lastMove: true, check: true }, coordinates: true,
    });
    updateTurnIndicator();
    startClockTick();

    gameWs = new WebSocket(WS_BASE + '/ws/game/' + gameId);
    gameWs.onopen = () => {
      gameWs.send(JSON.stringify({ type: 'claim', color: myColor }));
      if (myProfile && currentUser) {
        gameWs.send(JSON.stringify({ type: 'profile', username: myProfile.username, elo: myProfile.elo, user_id: currentUser.id, time_control: window._timeControl || null }));
      }
      gameWs._ping = setInterval(() => {
        if (gameWs && gameWs.readyState === WebSocket.OPEN) gameWs.send(JSON.stringify({ type: 'ping' }));
      }, 20000);
    };
    gameWs.onmessage = onGameMessage;
    gameWs.onclose = () => {
      if (gameWs && gameWs._ping) clearInterval(gameWs._ping);
      if (!gameOver) showGameStatus('Connection lost.');
    };
  }
}
function sendGame(obj) {
  if (gameWs && gameWs.readyState === WebSocket.OPEN) {
    gameWs.send(JSON.stringify(obj));
  }
}

// ═══════════════════════════════════════════════════════════════
//  BOARD INTERACTION
// ═══════════════════════════════════════════════════════════════
// onDragStart removed — chessground movable.dests handles piece permissions

function isPromotion(source, target) {
  const piece = game.get(source);
  if (!piece || piece.type !== 'p') return false;
  return (piece.color === 'w' && target[1] === '8') ||
         (piece.color === 'b' && target[1] === '1');
}

function showPromotion(source, target, callback) {
  const color = myColor === 'white' ? 'w' : 'b';
  const pieces = ['q','r','b','n'];
  const labels = { q:'Queen', r:'Rook', b:'Bishop', n:'Knight' };
  const container = document.getElementById('promo-pieces');
  container.innerHTML = '';
  pieces.forEach(p => {
    const div = document.createElement('div');
    div.className = 'promo-piece';
    div.title = labels[p];
    const img = document.createElement('img');
    img.src = 'img/chesspieces/wikipedia/' + color + p.toUpperCase() + '.png';
    img.alt = labels[p];
    div.appendChild(img);
    div.onclick = () => {
      document.getElementById('promo-overlay').classList.remove('active');
      callback(p);
    };
    container.appendChild(div);
  });
  document.getElementById('promo-overlay').classList.add('active');
}

function executeMove(source, target, promo) {
  const move = game.move({ from: source, to: target, promotion: promo });
  if (!move) { cg.set({ fen: game.fen() }); return; }
  // Clear first-move deadline warning
  if (window._firstMoveWarn) { clearInterval(window._firstMoveWarn); window._firstMoveWarn = null; }
  myTurn = false;
  updateTurnIndicator();
  if (cg) cg.set({ fen: game.fen(), lastMove: [source, target] });
  refreshDests();
  sendGame({ type: 'move', move: move.from + move.to + (move.promotion || '') });
  if (game.game_over()) return;
  if (game.in_threefold_repetition()) {
    sendGame({ type: 'draw_claim', reason: 'threefold_repetition' });
  }
}

// afterMove: called by chessground after drag or tap-to-move
function afterMove(source, target) {
  if (!myTurn || gameOver) { cg.set({ fen: game.fen() }); return; }
  if (isPromotion(source, target)) {
    showPromotion(source, target, promo => executeMove(source, target, promo));
    return;
  }
  executeMove(source, target, 'q');
}

// onDrop/onSquareClick/isMobile removed — chessground handles interaction natively

// Highlights handled by chessground natively
function highlightMoves(square) { /* chessground shows dests */ }
function clearHighlights() { /* chessground clears automatically */ }
function highlightLastMove(uci) {
  if (!uci || uci.length < 4 || !cg) return;
  if (cg) cg.set({ lastMove: [uci.slice(0,2), uci.slice(2,4)] });
}

// ═══════════════════════════════════════════════════════════════
//  CLOCKS
// ═══════════════════════════════════════════════════════════════
function resetClockDisplay() {
  clocks = { white: 300, black: 300 };
  renderClocks();
}

function updateClocks(serverClock) {
  if (!serverClock) return;
  clocks.white = serverClock.w;
  clocks.black = serverClock.b;
  renderClocks();
}

function renderClocks() {
  const myC   = myColor === 'white' ? clocks.white : clocks.black;
  const oppC  = myColor === 'white' ? clocks.black : clocks.white;

  document.getElementById('clock-me').textContent       = formatClock(myC);
  document.getElementById('clock-opponent').textContent = formatClock(oppC);

  // Color feedback
  const meEl  = document.getElementById('clock-me');
  const oppEl = document.getElementById('clock-opponent');
  meEl.className  = 'clock' + (myTurn ? ' active-clock' : '') + (myC  < 30 ? ' low' : '');
  oppEl.className = 'clock' + (!myTurn ? ' active-clock' : '') + (oppC < 30 ? ' low' : '');
}

function formatClock(secs) {
  const s = Math.max(0, Math.floor(secs));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function startClockTick() {
  stopClockTick();
  clockInterval = setInterval(() => {
    if (gameOver) return stopClockTick();
    if (myTurn) {
      clocks[myColor] = Math.max(0, clocks[myColor] - 0.1);
    } else {
      const oppColor = myColor === 'white' ? 'black' : 'white';
      clocks[oppColor] = Math.max(0, clocks[oppColor] - 0.1);
    }
    renderClocks();
  }, 100);
}

function stopClockTick() {
  if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
}

// ═══════════════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════════════
function updateTurnIndicator() {
  const myNameEl  = document.getElementById('name-me');
  const oppNameEl = document.getElementById('name-opponent');
  if (myTurn) {
    myNameEl.classList.add('active-turn');
    oppNameEl.classList.remove('active-turn');
    showGameStatus('Your move.');
  } else {
    oppNameEl.classList.add('active-turn');
    myNameEl.classList.remove('active-turn');
    showGameStatus('Opponent thinking...');
  }
}

function showGameStatus(msg, highlight) {
  const el = document.getElementById('game-status');
  el.textContent = msg;
  el.className = 'status-bar' + (highlight ? ' highlight' : '');
}

function appendMove(uci) {
  if (!uci) return;
  const list = document.getElementById('move-list');
  const moveNum = Math.ceil(game.history().length / 2);
  if (game.history().length % 2 === 1) {
    const num = document.createElement('span');
    num.textContent = moveNum + '.';
    list.appendChild(num);
  }
  const mv = document.createElement('span');
  mv.textContent = uci + ' ';
  list.appendChild(mv);
  list.scrollTop = list.scrollHeight;
}

function showOverlay(result, reason) {
  const overlay = document.getElementById('overlay');
  if (overlay.classList.contains('active')) return;
  overlay.classList.add('active');

  const title    = document.getElementById('result-title');
  const reasonEl = document.getElementById('result-reason');

  const reasonText = {
    checkmate:              'by checkmate',
    timeout:                'on time',
    resignation:            'by resignation',
    disconnect:             'opponent disconnected',
    stalemate:              'stalemate',
    agreement:              'by agreement',
    insufficient_material:  'insufficient material',
    seventyfive_moves:      '75-move rule',
    fivefold_repetition:    'fivefold repetition',
  }[reason] || reason;

  if (result === 'draw') {
    title.className = 'result-title draw';
    title.textContent = 'Draw';
  } else if (result === myColor) {
    title.className = 'result-title';
    title.textContent = 'You Win';
  } else {
    title.className = 'result-title lose';
    title.textContent = 'You Lose';
  }
  reasonEl.textContent = reasonText;
  updateSessionScore(result);

  const oldDecline = document.getElementById('btn-decline');
  if (oldDecline) oldDecline.remove();

  if (window._tournamentId) {
    // Show tournament buttons, hide regular rematch buttons
    const regularBtns = document.getElementById('btn-rematch').closest('.controls');
    if (regularBtns) regularBtns.style.display = 'none';
    const tourneyBtns = document.getElementById('tournament-overlay-btns');
    if (tourneyBtns) tourneyBtns.style.display = 'flex';
    document.getElementById('rematch-status').textContent = 'Submitting result…';

    const backBtn = document.getElementById('btn-back-tournament');
    if (backBtn) backBtn.onclick = () => {
      window.location.href = '/tournaments#' + window._tournamentId;
    };

    // Submit tournament result
    if (window._tournamentDbId) {
      sb && sb.auth.getSession().then(({ data }) => {
        if (!data.session) {
          document.getElementById('rematch-status').textContent = 'Session expired — result not saved.';
          return;
        }
        fetch('/api/tournament/result', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + data.session.access_token
          },
          body: JSON.stringify({
            game_id:      window._tournamentDbId,
            result,
            user_id:      currentUser && currentUser.id,
            time_control: window._timeControl || null,
          })
        })
        .then(r => r.json())
        .then(data => {
          if (data.error) {
            document.getElementById('rematch-status').textContent = 'Result submit failed.';
          } else {
            let secs = 5;
            const statusEl = document.getElementById('rematch-status');
            const countdown = setInterval(() => {
              if (statusEl) statusEl.textContent = `Returning to tournament in ${secs}s…`;
              secs--;
              if (secs < 0) {
                clearInterval(countdown);
                window.location.href = '/tournaments#' + window._tournamentId;
              }
            }, 1000);
            if (backBtn) backBtn.onclick = () => {
              clearInterval(countdown);
              window.location.href = '/tournaments#' + window._tournamentId;
            };
          }
        })
        .catch(() => {
          document.getElementById('rematch-status').textContent = 'Could not submit result — check connection.';
        });
      });
    }
  } else {
    // Restore regular rematch buttons in case we're reusing the overlay
    const regularBtns = document.getElementById('btn-rematch').closest('.controls');
    if (regularBtns) regularBtns.style.display = 'flex';
    const tourneyBtns = document.getElementById('tournament-overlay-btns');
    if (tourneyBtns) tourneyBtns.style.display = 'none';
    document.getElementById('btn-rematch').textContent = 'Rematch';
    document.getElementById('btn-rematch').disabled = false;
    document.getElementById('btn-rematch').onclick = offerRematch;
    document.getElementById('rematch-status').textContent = '';
  }

  // Save multiplayer game to history — delay 2s so opponent_profile has time to arrive
  if (sb && currentUser && multiMoveHistory.length > 0) {
    var pgn = '';
    multiMoveHistory.forEach(function(uci, i) {
      if (i % 2 === 0) pgn += (Math.floor(i/2) + 1) + '. ';
      pgn += uci + ' ';
    });
    var savedPgn    = pgn.trim();
    var savedResult = result;
    var savedColor  = myColor;
    setTimeout(function() {
      sb.from('games').insert({
        user_id:           currentUser.id,
        pgn:               savedPgn,
        result:            savedResult,
        player_color:      savedColor,
        opponent:          opponentUsername ? 'human:' + opponentUsername : 'human',
        player_elo_before: myProfile ? (myProfile.eloBefore || myProfile.elo) : null,
        player_elo_after:  myProfile ? myProfile.elo : null,
      }).then(function(res) {
        if (res.error) console.error('Multiplayer save failed:', res.error.message);
        else console.log('Multiplayer game saved. Opponent:', opponentUsername);
      });
    }, 2000);
  }
  multiMoveHistory = [];
}

// ═══════════════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════════════
function resign() {
  if (gameOver || !gameWs) return;
  if (confirm('Resign this game?')) {
    sendGame({ type: 'resign' });
  }
}

function offerDraw() {
  if (gameOver || !gameWs) return;
  sendGame({ type: 'draw_offer' });
  showGameStatus('Draw offered.');
}

function goToLobby() {
  gameOver = true;
  stopClockTick();
  if (gameWs) { gameWs.close(); gameWs = null; }
  gameId = null; myColor = null;
  document.getElementById('overlay').classList.remove('active');
  connectLobby();
}
