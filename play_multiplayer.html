<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Africhess — Play Live</title>
  <link rel="stylesheet" href="chessboard-1.0.0.min.css">
  <script src="jquery.min.js"></script>
  <script src="chessboard-1.0.0.min.js"></script>
  <script src="chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --green: #00ff9d;
      --bg: #0d0d0d;
      --bg2: #161616;
      --border: #2a2a2a;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      font-family: 'Georgia', serif;
      color: #e8e6e0;
      padding: 16px;
      margin: 0;
    }

    .header {
      max-width: 520px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 18px;
      letter-spacing: 0.2em;
      color: var(--green);
      text-decoration: none;
    }

    .screen { display: none; flex-direction: column; align-items: center; gap: 20px; max-width: 520px; margin: 0 auto; }
    .screen.active { display: flex; }

    /* Lobby */
    .lobby-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 60px 40px;
      text-align: center;
      border-radius: 4px;
      width: 100%;
    }

    /* Game */
    .player-bar {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 3px;
    }
    .clock {
      font-family: monospace;
      font-size: 22px;
      font-weight: bold;
    }
    .clock.low { color: #ff4d4d; animation: flash 1s infinite; }
    @keyframes flash { 50% { opacity: 0.4; } }

    #board { width: 100%; max-width: 480px; }

    .status-bar {
      text-align: center;
      padding: 8px;
      min-height: 28px;
      font-size: 14px;
      color: #aaa;
    }

    button {
      padding: 10px 20px;
      background: transparent;
      color: var(--green);
      border: 1px solid var(--green);
      cursor: pointer;
      font-family: 'Georgia', serif;
      letter-spacing: 0.1em;
      border-radius: 2px;
    }
    button:hover { background: var(--green); color: #111; }
    button.danger { color: #ff4d4d; border-color: #ff4d4d; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay.active { display: flex; }

    .result-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-top: 4px solid var(--green);
      padding: 40px;
      text-align: center;
      min-width: 320px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="/" class="logo">AFRICHESS</a>
    <span style="font-size:12px;color:#555;">5+0 Blitz</span>
  </div>

  <!-- LOBBY -->
  <div id="screen-lobby" class="screen active">
    <div class="lobby-box">
      <div style="font-size:13px;letter-spacing:2px;color:#666;margin-bottom:20px;">FINDING OPPONENT</div>
      <div style="font-size:32px;margin:20px 0;">⋯</div>
      <div id="lobby-status">Connecting to server...</div>
      <div id="guest-label" style="margin-top:20px;font-family:monospace;font-size:11px;color:#444;"></div>
    </div>
    <button onclick="cancelLobby()" style="margin-top:20px;">Cancel</button>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <!-- Opponent -->
    <div class="player-bar">
      <span id="name-opponent">Opponent</span>
      <span class="clock" id="clock-opponent">5:00</span>
    </div>

    <div id="board"></div>

    <!-- You -->
    <div class="player-bar">
      <span id="name-me">You</span>
      <span class="clock" id="clock-me">5:00</span>
    </div>

    <div class="status-bar" id="game-status">Waiting for opponent...</div>

    <div style="display:flex; gap:12px;">
      <button onclick="offerDraw()">Draw</button>
      <button class="danger" onclick="resign()">Resign</button>
      <button onclick="goToLobby()">New Game</button>
    </div>

    <div style="margin-top:20px;width:100%;background:var(--bg2);border:1px solid var(--border);padding:12px;border-radius:3px;">
      <div style="font-size:10px;color:#555;letter-spacing:1px;margin-bottom:8px;">MOVES</div>
      <div id="move-list" style="font-family:monospace;font-size:13px;max-height:120px;overflow-y:auto;line-height:1.5;"></div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay" id="overlay">
    <div class="result-card">
      <div id="result-title" style="font-size:28px;letter-spacing:2px;margin-bottom:8px;">WIN</div>
      <div id="result-reason" style="color:#888;font-size:13px;"></div>
      
      <div id="rematch-area" style="margin-top:24px;">
        <button id="btn-rematch" onclick="offerRematch()">REMATCH</button>
        <button onclick="goToLobby()" style="margin-left:12px;">New Game</button>
      </div>
    </div>
  </div>

<script>
// ========================= CONFIG =========================
const WS_BASE = window.location.hostname === 'localhost' ? 'ws://127.0.0.1:8080' : `wss://${window.location.hostname}`;
const SUPABASE_URL = 'https://nbskgzsvygdmlvwbetxn.supabase.co';
const SUPABASE_ANON = 'sb_publishable_g5BEYnjhPatfmnHG3jNQTQ_fzgKOy4s';

let sb, currentUser = null;
let lobbyWs = null;
let gameWs = null;
let gameId = null;
let myColor = null;
let myId = null;
let game = new Chess();
let board = null;
let clocks = { w: 300, b: 300 };
let gameOver = false;
let myTurn = false;

// Init Supabase
try {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  sb.auth.getSession().then(({data}) => {
    if (data.session) currentUser = data.session.user;
  });
} catch(e) {}

// ========================= LOBBY =========================
function connectLobby() {
  document.getElementById('screen-lobby').classList.add('active');
  document.getElementById('screen-game').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');

  lobbyWs = new WebSocket(WS_BASE + '/ws/lobby');

  lobbyWs.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'waiting') {
      myId = msg.guest_id;
      document.getElementById('guest-label').textContent = myId;
    }
    if (msg.type === 'matched') {
      gameId = msg.game_id;
      myColor = msg.color;
      startGame();
    }
  };

  lobbyWs.onclose = () => {
    if (!gameId) setTimeout(connectLobby, 2000);
  };
}

function cancelLobby() {
  if (lobbyWs) lobbyWs.close();
  window.location.href = '/';
}

// ========================= GAME =========================
function startGame() {
  document.getElementById('screen-lobby').classList.remove('active');
  document.getElementById('screen-game').classList.add('active');

  game = new Chess();
  gameOver = false;
  myTurn = myColor === 'white';

  document.getElementById('name-me').textContent = (currentUser ? currentUser.email.split('@')[0] : myId) + " (You)";
  document.getElementById('name-opponent').textContent = "Opponent";

  board = Chessboard('board', {
    draggable: true,
    position: 'start',
    orientation: myColor,
    onDrop: handleDrop,
    pieceTheme: 'img/chesspieces/wikipedia/{piece}.png'
  });

  gameWs = new WebSocket(WS_BASE + '/ws/game/' + gameId);
  gameWs.onmessage = handleGameMessage;
}

function handleDrop(source, target) {
  if (!myTurn || gameOver) return 'snapback';
  const move = game.move({from: source, to: target, promotion: 'q'});
  if (!move) return 'snapback';

  gameWs.send(JSON.stringify({ type: 'move', move: move.from + move.to }));
  myTurn = false;
  updateUI();
}

function handleGameMessage(e) {
  const msg = JSON.parse(e.data);

  if (msg.type === 'move') {
    game.load(msg.fen);
    board.position(msg.fen);
    myTurn = msg.turn === myColor;
    updateUI();
  }

  if (msg.type === 'gameover') {
    gameOver = true;
    showGameOver(msg.result, msg.reason);
  }

  if (msg.type === 'elo_update') {
    console.log('ELO updated:', msg.new_elo);
  }
}

function updateUI() {
  document.getElementById('game-status').textContent = myTurn ? "Your turn" : "Opponent's turn";
}

function showGameOver(result, reason) {
  document.getElementById('overlay').classList.add('active');
  document.getElementById('result-title').textContent = 
    result === myColor ? "YOU WIN" : result === 'draw' ? "DRAW" : "YOU LOSE";
}

// Actions
function resign() {
  if (gameWs) gameWs.send(JSON.stringify({type: 'resign'}));
}

function offerDraw() {
  if (gameWs) gameWs.send(JSON.stringify({type: 'draw_offer'}));
}

function offerRematch() {
  if (gameWs) gameWs.send(JSON.stringify({type: 'rematch_offer'}));
}

function goToLobby() {
  if (gameWs) gameWs.close();
  connectLobby();
}

// Boot
window.onload = () => {
  connectLobby();
};
</script>
</body>
</html>
