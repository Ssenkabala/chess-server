<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Africhess — Play</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Play live 5+0 blitz chess against other players on AfriChess.">
  <meta property="og:title" content="AfriChess — Live Multiplayer">
  <meta property="og:image" content="https://www.africhess.org/android-chrome-512x512.png">
  <meta property="og:url" content="https://www.africhess.org/multiplayer">
  <link rel="stylesheet" href="chessboard-1.0.0.min.css">
  <script src="jquery.min.js"></script>
  <script src="chessboard-1.0.0.min.js"></script>
  <script src="chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #00ff9d;
      --green2:  #00cc7a;
      --bg:      #0d0d0d;
      --bg2:     #161616;
      --bg3:     #1e1e1e;
      --border:  #2a2a2a;
      --text:    #e8e6e0;
      --muted:   #666;
      --danger:  #ff4d4d;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Georgia', serif;
      color: var(--text);
      padding: 24px 16px;
      gap: 0;
    }

    /* ── Header ── */
    .header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 18px;
      letter-spacing: 0.2em;
      color: var(--green);
      text-transform: uppercase;
      text-decoration: none;
    }
    .header-right {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* ── Screens ── */
    .screen { display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 520px; }
    .screen.active { display: flex; }

    /* ── Lobby screen ── */
    .lobby-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 48px 40px;
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .lobby-title {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .lobby-status {
      font-size: 20px;
      color: var(--text);
      letter-spacing: 0.05em;
    }

    /* Pulsing dots */
    .dots {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1.1); }
    }

    .guest-id {
      font-size: 11px;
      color: #444;
      font-family: monospace;
      letter-spacing: 0.1em;
    }

    /* ── Game screen ── */
    .game-wrap {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Player bar */
    .player-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 3px;
    }
    .player-name {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .player-name.active-turn { color: var(--green); }

    .clock {
      font-family: monospace;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: var(--text);
      min-width: 60px;
      text-align: right;
    }
    .clock.low { color: var(--danger); animation: flash 1s step-end infinite; }
    @keyframes flash { 50% { opacity: 0.4; } }
    .clock.active-clock { color: var(--green); }

    /* Board */
    #board { width: 480px; }
    @media (max-width: 600px) {
      #board {
        width: calc(100vw - 12px) !important;
        max-width: calc(100vw - 12px) !important;
        margin: 0 auto;
      }
    }

    /* Status bar */
    .status-bar {
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.06em;
      padding: 6px 0;
      min-height: 28px;
    }
    .status-bar.highlight { color: var(--green); }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 9px 22px;
      background: transparent;
      color: var(--green);
      border: 1px solid var(--green);
      font-size: 13px;
      font-family: 'Georgia', serif;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.18s;
      text-transform: uppercase;
    }
    button:hover { background: var(--green); color: #111; }
    button.danger { color: var(--danger); border-color: var(--danger); }
    button.danger:hover { background: var(--danger); color: #fff; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Move list */
    .move-list-wrap {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 12px 14px;
      max-height: 120px;
      overflow-y: auto;
    }
    .move-list-label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 8px;
    }
    .move-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      font-family: monospace;
      font-size: 13px;
      color: #aaa;
    }
    .move-list span { color: #555; margin-right: 2px; }

    /* Game over overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay.active { display: flex; }
    .result-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-top: 3px solid var(--green);
      border-radius: 4px;
      padding: 40px 48px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 280px;
    }
    .result-title {
      font-size: 28px;
      letter-spacing: 0.1em;
      color: var(--green);
      text-transform: uppercase;
    }
    .result-title.lose { color: var(--danger); }
    .result-title.draw { color: #aaa; }

    /* ── Promotion picker ── */
    .promo-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 500;
      align-items: center; justify-content: center;
    }
    .promo-overlay.active { display: flex; }
    .promo-box {
      background: #111; border: 1px solid #333;
      border-radius: 4px; padding: 20px 24px; text-align: center;
    }
    .promo-title {
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: #555; margin-bottom: 16px;
    }
    .promo-pieces { display: flex; gap: 8px; }
    .promo-piece {
      width: 64px; height: 64px; background: #1a1a1a;
      border: 1px solid #333; border-radius: 3px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .promo-piece:hover { border-color: #00ff9d; background: #0d1f17; }
    .promo-piece img { width: 48px; height: 48px; }
    .result-reason {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .session-score {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .session-score span {
      padding: 4px 12px;
      background: var(--bg2);
      color: var(--muted);
    }
    .session-score .sc-w { color: var(--green); }
    .session-score .sc-d { color: #777; }
    .session-score .sc-l { color: var(--danger); }
    .session-score .sep  { color: #333; padding: 4px 4px; background: var(--bg); }

    /* Highlight */
    .highlight-move {
      background: rgba(0,255,157,0.22) !important;
    }
    .highlight-selected { background: rgba(0,255,157,0.18) !important; }
    .highlight-square {
      background: radial-gradient(circle, rgba(0,255,157,0.55) 25%, transparent 27%) !important;
    }
    .highlight-capture {
      background: radial-gradient(circle, transparent 55%, rgba(0,255,157,0.55) 57%) !important;
    }
  </style>
</head>
<body>

  <div class="header">
    <a class="logo" href="/">Africhess</a>
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="/profile" style="padding:5px 14px;background:transparent;color:#00ff9d;border:1px solid #00ff9d33;font-size:11px;font-family:Georgia,serif;letter-spacing:0.1em;text-decoration:none;border-radius:2px;">Profile</a>
      <a href="/tournaments" style="padding:5px 14px;background:transparent;color:#00ff9d;border:1px solid #00ff9d33;font-size:11px;font-family:Georgia,serif;letter-spacing:0.1em;text-decoration:none;border-radius:2px;">Tournaments</a>
      <a href="/history" style="padding:5px 14px;background:transparent;color:#00ff9d;border:1px solid #00ff9d33;font-size:11px;font-family:Georgia,serif;letter-spacing:0.1em;text-decoration:none;border-radius:2px;">History</a>
      <span class="header-right">5+0 · Blitz</span>
    </div>
  </div>

  <!-- ══ LOBBY SCREEN ══ -->
  <div id="screen-lobby" class="screen active">
    <div class="lobby-box">
      <div class="lobby-title">Finding opponent</div>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="lobby-status" id="lobby-status">Connecting...</div>
      <div class="guest-id" id="guest-label"></div>
    </div>
    <div class="controls">
      <button onclick="cancelLobby()">Cancel</button>
    </div>
  </div>

  <!-- ══ GAME SCREEN ══ -->
  <div id="screen-game" class="screen">
    <div class="game-wrap">

      <!-- Opponent bar (top) -->
      <div class="player-bar" id="bar-opponent">
        <span class="player-name" id="name-opponent">Opponent</span>
        <span class="clock" id="clock-opponent">5:00</span>
      </div>

      <!-- Board -->
      <div id="board"></div>

      <!-- My bar (bottom) -->
      <div class="player-bar" id="bar-me">
        <span class="player-name" id="name-me">You</span>
        <span class="clock" id="clock-me">5:00</span>
      </div>

      <div class="status-bar" id="game-status">Waiting for game to start...</div>

      <div class="controls">
        <button onclick="offerDraw()">Draw</button>
        <button class="danger" onclick="resign()">Resign</button>
        <button onclick="goToLobby()">New Game</button>
      </div>

      <!-- Move list -->
      <div class="move-list-wrap">
        <div class="move-list-label">Moves</div>
        <div class="move-list" id="move-list"></div>
      </div>

    </div>
  </div>

  <!-- ══ GAME OVER OVERLAY ══ -->
  <div class="overlay" id="overlay">
    <div class="result-card" style="position:relative;">
      <button onclick="document.getElementById('overlay').classList.remove('active')" style="position:absolute;top:8px;right:10px;background:none;border:none;color:#555;font-size:18px;cursor:pointer;line-height:1;padding:4px 6px;" title="Close">✕</button>
      <div class="result-title" id="result-title">Draw</div>
      <div class="result-reason" id="result-reason">by agreement</div>
      <div class="session-score" id="session-score" style="display:none; justify-content:center; margin-top:4px;">
        <span class="sc-w" id="sc-w">0W</span>
        <span class="sep">/</span>
        <span class="sc-d" id="sc-d">0D</span>
        <span class="sep">/</span>
        <span class="sc-l" id="sc-l">0L</span>
      </div>
      <div id="rematch-area" style="margin-top:8px;">
        <div class="controls" style="justify-content:center;">
          <button id="btn-rematch" onclick="offerRematch()">Rematch</button>
          <button onclick="goToLobby()">New Game</button>
        </div>
        <div id="rematch-status" style="font-size:11px; color:var(--muted); text-align:center; margin-top:6px; letter-spacing:0.08em;"></div>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL  = 'https://nbskgzsvygdmlvwbetxn.supabase.co';
const SUPABASE_ANON = 'sb_publishable_g5BEYnjhPatfmnHG3jNQTQ_fzgKOy4s';
let sb;
try {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
} catch(e) { sb = null; }
let sessionScore  = { w: 0, d: 0, l: 0 };
let sessionOpponentId = null;   // tracks if we're vs same opponent
let myEloChange = null;
let opponentUsername = null;
let currentUser = null;
let myProfile   = null;  // { username, elo }
let multiMoveHistory = [];

function offerRematch() {
  sendGame({ type: 'rematch_offer' });
  document.getElementById('rematch-status').textContent = 'Rematch offered — waiting...';
  document.getElementById('btn-rematch').disabled = true;
}

function updateSessionScore(result) {
  if (result === myColor)       sessionScore.w++;
  else if (result === 'draw')   sessionScore.d++;
  else                          sessionScore.l++;

  document.getElementById('sc-w').textContent = sessionScore.w + 'W';
  document.getElementById('sc-d').textContent = sessionScore.d + 'D';
  document.getElementById('sc-l').textContent = sessionScore.l + 'L';
  document.getElementById('session-score').style.display = 'flex';
}

// ═══════════════════════════════════════════════════════════════
//  AUTH + PROFILE
// ═══════════════════════════════════════════════════════════════
async function bootAuth() {
  if (!sb) { connectLobby(); return; }

  const { data } = await sb.auth.getSession();
  if (data.session) {
    currentUser = data.session.user;
    // Load profile
    const { data: profile } = await sb
      .from('profiles')
      .select('username, elo')
      .eq('user_id', currentUser.id)
      .single();

    if (profile) {
      myProfile = profile;
    } else {
      // No profile — send them to play page to set username first
      alert('Please set your username before playing multiplayer.');
      window.location.href = '/play';
      return;
    }
  }
  // Guest or logged-in with profile — both can enter lobby
  connectLobby();
}
// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
const WS_BASE = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? 'ws://127.0.0.1:8000'
  : 'wss://' + location.hostname;

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let lobbyWs   = null;
let gameWs    = null;
let myColor   = null;   // 'white' | 'black'
let myId      = null;
let gameId    = null;
let game      = new Chess();
let board     = null;
let selectedSq = null;
let myTurn    = false;
let gameOver  = false;

// Clock state
let clocks = { white: 300, black: 300 };
let clockInterval = null;

// ═══════════════════════════════════════════════════════════════
//  SCREENS
// ═══════════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

// ═══════════════════════════════════════════════════════════════
//  LOBBY
// ═══════════════════════════════════════════════════════════════
function connectLobby() {
  showScreen('lobby');
  setLobbyStatus('Connecting...');
  lobbyWs = new WebSocket(WS_BASE + '/ws/lobby');

  lobbyWs.onopen = () => {
    setLobbyStatus('Searching for opponent...');
    // Keepalive — Railway kills idle connections after ~30s
    lobbyWs._ping = setInterval(() => {
      if (lobbyWs && lobbyWs.readyState === WebSocket.OPEN) {
        lobbyWs.send(JSON.stringify({ type: 'ping' }));
      }
    }, 20000);
  };

  lobbyWs.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'waiting') {
      myId = msg.guest_id;
      document.getElementById('guest-label').textContent = myId;
      setLobbyStatus('Searching for opponent...');
    }

    if (msg.type === 'matched') {
      gameId   = msg.game_id;
      myColor  = msg.color;
      setLobbyStatus('Opponent found! Starting game...');
      setTimeout(() => startGame(), 400);
    }
  };

  lobbyWs.onclose = () => {
    if (lobbyWs && lobbyWs._ping) clearInterval(lobbyWs._ping);
    if (!gameId) setLobbyStatus('Connection lost. Retrying...');
  };

  lobbyWs.onerror = () => setLobbyStatus('Connection error. Check server.');
}

function setLobbyStatus(msg) {
  document.getElementById('lobby-status').textContent = msg;
}

function cancelLobby() {
  if (lobbyWs) lobbyWs.close();
  gameId = null;
  location.href = '/';
}
// Prevent page scroll when dragging pieces on mobile
// ═══════════════════════════════════════════════════════════════
//  GAME INIT
// ═══════════════════════════════════════════════════════════════
function startGame() {
  showScreen('game');
  game     = new Chess();
  gameOver = false;
  selectedSq = null;
  myTurn   = myColor === 'white';

  // Player labels
  const opponentColor = myColor === 'white' ? 'black' : 'white';
  const myName = myProfile ? myProfile.username : myId;
  const myElo  = myProfile ? myProfile.elo : null;
  document.getElementById('name-me').textContent = myName + ' (' + myColor + ')';
  if (myElo) {
    document.getElementById('name-me').innerHTML =
      '<strong>' + myName + '</strong> <span style="font-size:11px;color:#444;">' + myElo + ' ELO</span> (' + myColor + ')';
  }
  document.getElementById('name-opponent').textContent = 'Opponent (' + opponentColor + ')';

  // Compute board pixel size before chessboard.js reads the element
  var _bpx = window.innerWidth <= 600 ? window.innerWidth - 24 : 480;
  var _bel = document.getElementById('board');
  _bel.style.width = _bpx + 'px';

  board = Chessboard('board', {
    draggable: true,
    position: 'start',
    orientation: myColor,
    pieceTheme: 'img/chesspieces/wikipedia/{piece}.png',
    onDragStart: onDragStart,
    onDrop: onDrop,
    onSnapEnd: () => board.position(game.fen()),
    width: _bpx,
  });

  // Single jQuery delegation for click-to-move.
  // sourceCapabilities check blocks synthetic mouse events after touchend.
  $('#board').off('click.sq').on('click.sq', '.square-55d63', function(e) {
    if (e.originalEvent && e.originalEvent.sourceCapabilities &&
        e.originalEvent.sourceCapabilities.firesTouchEvents) return;
    var sq = $(this).attr('data-square');
    if (sq) onSquareClick(sq);
  });

  // Resize hook
  window.addEventListener('resize', function() {
    var px = window.innerWidth <= 600 ? window.innerWidth - 24 : 480;
    document.getElementById('board').style.width = px + 'px';
    if (board && board.resize) board.resize();
  });

  resetClockDisplay();
  updateTurnIndicator();
  startClockTick();

  // Connect game websocket after board is ready
  gameWs = new WebSocket(WS_BASE + '/ws/game/' + gameId);
  gameWs.onopen = () => {
    // Close lobby socket ONLY after game socket is confirmed open
    if (lobbyWs) { lobbyWs.close(); lobbyWs = null; }

    // First: claim our color slot so server assigns correctly
    gameWs.send(JSON.stringify({ type: 'claim', color: myColor }));

    // Send profile so server can share with opponent and calculate ELO
    if (myProfile && currentUser) {
      gameWs.send(JSON.stringify({
        type:     'profile',
        username: myProfile.username,
        elo:      myProfile.elo,
        user_id:  currentUser.id
      }));
    }
    // Keepalive — Railway kills idle connections after ~30s
    gameWs._ping = setInterval(() => {
      if (gameWs && gameWs.readyState === WebSocket.OPEN) {
        gameWs.send(JSON.stringify({ type: 'ping' }));
      }
    }, 20000);
  };
  gameWs.onmessage = onGameMessage;
  gameWs.onclose   = () => {
    if (gameWs && gameWs._ping) clearInterval(gameWs._ping);
    if (!gameOver) showGameStatus('Connection lost.');
  };

  document.getElementById('move-list').innerHTML = '';
  document.getElementById('overlay').classList.remove('active');
}

// ═══════════════════════════════════════════════════════════════
//  WEBSOCKET MESSAGES
// ═══════════════════════════════════════════════════════════════
function onGameMessage(e) {
  const msg = JSON.parse(e.data);

  // Keepalive — ignore pings from server
  if (msg.type === 'ping' || msg.type === 'pong') return;

  if (msg.type === 'opponent_profile') {
    opponentUsername = msg.username;
    const opColor = myColor === 'white' ? 'black' : 'white';
    document.getElementById('name-opponent').innerHTML =
      '<strong>' + msg.username + '</strong>' +
      (msg.elo ? ' <span style="font-size:11px;color:#444;">' + msg.elo + ' ELO</span>' : '') +
      ' (' + opColor + ')';
    return;
  }

  if (msg.type === 'elo_update') {
    const change = msg.new_elo - msg.old_elo;
    const sign   = change >= 0 ? '+' : '';
    const color  = change >= 0 ? '#00ff9d' : '#ff4d4d';
    const el     = document.getElementById('result-reason');
    if (el) el.innerHTML += ' <span style="color:' + color + ';font-size:12px;">' +
      '(' + sign + change + ' ELO · now ' + msg.new_elo + ')</span>';
    myEloChange = msg.new_elo - msg.old_elo;
    if (myProfile) {
      myProfile.eloBefore = msg.old_elo;
      myProfile.elo = msg.new_elo;
    }
    return;
  }

  if (msg.type === 'draw_offer_received') {
    // Show draw offer to opponent
    document.getElementById('rematch-status').textContent = 'Opponent offers a draw!';
    const area = document.getElementById('rematch-area');
    if (area && !document.getElementById('btn-accept-draw')) {
      const btn = document.createElement('button');
      btn.id = 'btn-accept-draw';
      btn.textContent = 'Accept Draw';
      btn.onclick = () => sendGame({ type: 'draw_accept' });
      area.querySelector('.controls').appendChild(btn);
    }
    return;
  }

  if (msg.type === 'clock') {
    clocks.white = msg.white;
    clocks.black = msg.black;
    renderClocks();
  }

  if (msg.type === 'gameover') {
    gameOver = true;
    stopClockTick();
    showOverlay(msg.result, msg.reason);
  }

  if (msg.type === 'draw_offer') {
    if (confirm('Opponent offers a draw. Accept?')) {
      sendGame({ type: 'draw_accept' });
    }
  }

  if (msg.type === 'error') {
    showGameStatus('⚠ ' + msg.detail);
  }
  if (msg.type === 'move') {
    game.load(msg.fen);
    board.position(msg.fen, false);
    highlightLastMove(msg.move);
    updateClocks(msg.clock);
    myTurn = msg.turn === myColor;
    updateTurnIndicator();
    multiMoveHistory.push(msg.move);
    appendMove(msg.move);
    clearHighlights();
  }
  if (msg.type === 'rematch_offer') {
    document.getElementById('rematch-status').textContent = 'Opponent wants a rematch!';
    document.getElementById('btn-rematch').textContent = 'Accept';
    document.getElementById('btn-rematch').onclick = () => {
      sendGame({ type: 'rematch_accept' });
      document.getElementById('rematch-status').textContent = 'Starting rematch...';
      document.getElementById('btn-rematch').disabled = true;
    };
    // Add decline button
    const area = document.getElementById('rematch-area').querySelector('.controls');
    if (!document.getElementById('btn-decline')) {
      const btn = document.createElement('button');
      btn.id = 'btn-decline'; btn.className = 'danger';
      btn.textContent = 'Decline';
      btn.onclick = () => { sendGame({ type: 'rematch_decline' }); goToLobby(); };
      area.insertBefore(btn, area.children[1]);
    }
  }

  if (msg.type === 'rematch_declined') {
    document.getElementById('rematch-status').textContent = 'Opponent declined.';
    document.getElementById('btn-rematch').disabled = true;
  }

  if (msg.type === 'rematch_start') {
    if (gameWs) { gameWs.onclose = null; gameWs.close(); gameWs = null; }

    gameId   = msg.game_id;
    myColor  = msg.color;
    gameOver = false;
    document.getElementById('overlay').classList.remove('active');

    game = new Chess();
    selectedSq = null;
    myTurn = myColor === 'white';
    document.getElementById('move-list').innerHTML = '';
    resetClockDisplay();

    var _rpx = window.innerWidth <= 600 ? window.innerWidth - 24 : 480;
    document.getElementById('board').style.width = _rpx + 'px';
    board = Chessboard('board', {
      draggable: true, position: 'start', orientation: myColor,
      pieceTheme: 'img/chesspieces/wikipedia/{piece}.png',
      onDragStart: onDragStart, onDrop: onDrop,
      onSnapEnd: () => board.position(game.fen()),
      width: _rpx,
    });
    $('#board').off('click.sq').on('click.sq', '.square-55d63', function(e) {
      if (e.originalEvent && e.originalEvent.sourceCapabilities &&
          e.originalEvent.sourceCapabilities.firesTouchEvents) return;
      var sq = $(this).attr('data-square');
      if (sq) onSquareClick(sq);
    });
    updateTurnIndicator();
    startClockTick();

    gameWs = new WebSocket(WS_BASE + '/ws/game/' + gameId);
    gameWs.onopen = () => {
      gameWs.send(JSON.stringify({ type: 'claim', color: myColor }));
      if (myProfile && currentUser) {
        gameWs.send(JSON.stringify({ type: 'profile', username: myProfile.username, elo: myProfile.elo, user_id: currentUser.id }));
      }
      gameWs._ping = setInterval(() => {
        if (gameWs && gameWs.readyState === WebSocket.OPEN) gameWs.send(JSON.stringify({ type: 'ping' }));
      }, 20000);
    };
    gameWs.onmessage = onGameMessage;
    gameWs.onclose = () => {
      if (gameWs && gameWs._ping) clearInterval(gameWs._ping);
      if (!gameOver) showGameStatus('Connection lost.');
    };
  }
}
function sendGame(obj) {
  if (gameWs && gameWs.readyState === WebSocket.OPEN) {
    gameWs.send(JSON.stringify(obj));
  }
}

// ═══════════════════════════════════════════════════════════════
//  BOARD INTERACTION
// ═══════════════════════════════════════════════════════════════
function onDragStart(source, piece) {
  if (!myTurn || gameOver) return false;
  if (myColor === 'white' && piece.startsWith('b')) return false;
  if (myColor === 'black' && piece.startsWith('w')) return false;
  clearHighlights();
  highlightMoves(source);
  selectedSq = source;
  return true;
}

function isPromotion(source, target) {
  const piece = game.get(source);
  if (!piece || piece.type !== 'p') return false;
  return (piece.color === 'w' && target[1] === '8') ||
         (piece.color === 'b' && target[1] === '1');
}

function showPromotion(source, target, callback) {
  const color = myColor === 'white' ? 'w' : 'b';
  const pieces = ['q','r','b','n'];
  const labels = { q:'Queen', r:'Rook', b:'Bishop', n:'Knight' };
  const container = document.getElementById('promo-pieces');
  container.innerHTML = '';
  pieces.forEach(p => {
    const div = document.createElement('div');
    div.className = 'promo-piece';
    div.title = labels[p];
    const img = document.createElement('img');
    img.src = 'img/chesspieces/wikipedia/' + color + p.toUpperCase() + '.png';
    img.alt = labels[p];
    div.appendChild(img);
    div.onclick = () => {
      document.getElementById('promo-overlay').classList.remove('active');
      callback(p);
    };
    container.appendChild(div);
  });
  document.getElementById('promo-overlay').classList.add('active');
}

function executeMove(source, target, promo) {
  const move = game.move({ from: source, to: target, promotion: promo });
  if (!move) { board.position(game.fen()); return; }
  myTurn = false;
  updateTurnIndicator();
  board.position(game.fen());
  sendGame({ type: 'move', move: move.from + move.to + (move.promotion || '') });
  if (game.game_over()) return;
  if (game.in_threefold_repetition()) {
    sendGame({ type: 'draw_claim', reason: 'threefold_repetition' });
  }
}

function onDrop(source, target) {
  clearHighlights();
  selectedSq = null;
  const test = game.move({ from: source, to: target, promotion: 'q' });
  if (!test) return 'snapback';
  game.undo();

  if (isPromotion(source, target)) {
    board.position(game.fen());
    showPromotion(source, target, promo => executeMove(source, target, promo));
    return 'snapback';
  }
  executeMove(source, target, 'q');
}

function onSquareClick(square) {
  if (!myTurn || gameOver) return;

  const piece = game.get(square);
  const myPieceColor = myColor === 'white' ? 'w' : 'b';

  if (piece && piece.color === myPieceColor) {
    clearHighlights();
    highlightMoves(square);
    selectedSq = square;
    return;
  }

  if (selectedSq) {
    const src = selectedSq;
    clearHighlights();
    selectedSq = null;
    const test = game.move({ from: src, to: square, promotion: 'q' });
    if (!test) return;
    game.undo();

    if (isPromotion(src, square)) {
      showPromotion(src, square, promo => executeMove(src, square, promo));
      return;
    }
    executeMove(src, square, 'q');
  }
}
function isMobile() {
  return window.innerWidth <= 600;
}

// ═══════════════════════════════════════════════════════════════
//  HIGHLIGHTS
// ═══════════════════════════════════════════════════════════════
function highlightMoves(square) {
  const moves = game.moves({ square, verbose: true });
  $('#board .square-' + square).addClass('highlight-selected');
  moves.forEach(m => {
    const isCapture = !!game.get(m.to) || m.flags.includes('e');
    $('#board .square-' + m.to).addClass(isCapture ? 'highlight-capture' : 'highlight-square');
  });
}

function clearHighlights() {
  $('#board .square-55d63').removeClass(
    'highlight-selected highlight-square highlight-capture highlight-move'
  );
}

function highlightLastMove(uci) {
  if (!uci || uci.length < 4) return;
  $('#board .square-' + uci.slice(0,2)).addClass('highlight-move');
  $('#board .square-' + uci.slice(2,4)).addClass('highlight-move');
}

// ═══════════════════════════════════════════════════════════════
//  CLOCKS
// ═══════════════════════════════════════════════════════════════
function resetClockDisplay() {
  clocks = { white: 300, black: 300 };
  renderClocks();
}

function updateClocks(serverClock) {
  if (!serverClock) return;
  clocks.white = serverClock.w;
  clocks.black = serverClock.b;
  renderClocks();
}

function renderClocks() {
  const myC   = myColor === 'white' ? clocks.white : clocks.black;
  const oppC  = myColor === 'white' ? clocks.black : clocks.white;

  document.getElementById('clock-me').textContent       = formatClock(myC);
  document.getElementById('clock-opponent').textContent = formatClock(oppC);

  // Color feedback
  const meEl  = document.getElementById('clock-me');
  const oppEl = document.getElementById('clock-opponent');
  meEl.className  = 'clock' + (myTurn ? ' active-clock' : '') + (myC  < 30 ? ' low' : '');
  oppEl.className = 'clock' + (!myTurn ? ' active-clock' : '') + (oppC < 30 ? ' low' : '');
}

function formatClock(secs) {
  const s = Math.max(0, Math.floor(secs));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function startClockTick() {
  stopClockTick();
  clockInterval = setInterval(() => {
    if (gameOver) return stopClockTick();
    if (myTurn) {
      clocks[myColor] = Math.max(0, clocks[myColor] - 0.1);
    } else {
      const oppColor = myColor === 'white' ? 'black' : 'white';
      clocks[oppColor] = Math.max(0, clocks[oppColor] - 0.1);
    }
    renderClocks();
  }, 100);
}

function stopClockTick() {
  if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
}

// ═══════════════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════════════
function updateTurnIndicator() {
  const myNameEl  = document.getElementById('name-me');
  const oppNameEl = document.getElementById('name-opponent');
  if (myTurn) {
    myNameEl.classList.add('active-turn');
    oppNameEl.classList.remove('active-turn');
    showGameStatus('Your move.');
  } else {
    oppNameEl.classList.add('active-turn');
    myNameEl.classList.remove('active-turn');
    showGameStatus('Opponent thinking...');
  }
}

function showGameStatus(msg, highlight) {
  const el = document.getElementById('game-status');
  el.textContent = msg;
  el.className = 'status-bar' + (highlight ? ' highlight' : '');
}

function appendMove(uci) {
  if (!uci) return;
  const list = document.getElementById('move-list');
  const moveNum = Math.ceil(game.history().length / 2);
  if (game.history().length % 2 === 1) {
    const num = document.createElement('span');
    num.textContent = moveNum + '.';
    list.appendChild(num);
  }
  const mv = document.createElement('span');
  mv.textContent = uci + ' ';
  list.appendChild(mv);
  list.scrollTop = list.scrollHeight;
}

function showOverlay(result, reason) {
  const overlay = document.getElementById('overlay');
  if (overlay.classList.contains('active')) return;
  const title   = document.getElementById('result-title');
  const reasonEl = document.getElementById('result-reason');

  if (overlay.classList.contains('active')) return; // already showing, don't double-count
  overlay.classList.add('active');

  const reasonText = {
    checkmate:   'by checkmate',
    timeout:     'on time',
    resignation: 'by resignation',
    disconnect:  'opponent disconnected',
    stalemate:   'stalemate',
    agreement:   'by agreement',
    insufficient_material: 'insufficient material',
    seventyfive_moves:     '75-move rule',
    fivefold_repetition:   'fivefold repetition',
  }[reason] || reason;

  if (result === 'draw') {
    title.className = 'result-title draw';
    title.textContent = 'Draw';
  } else if (result === myColor) {
    title.className = 'result-title';
    title.textContent = 'You Win';
  } else {
    title.className = 'result-title lose';
    title.textContent = 'You Lose';
  }
  reasonEl.textContent = reasonText;
  updateSessionScore(result);
  document.getElementById('btn-rematch').textContent = 'Rematch';
  document.getElementById('btn-rematch').disabled = false;
  document.getElementById('btn-rematch').onclick = offerRematch;
  document.getElementById('rematch-status').textContent = '';
  // Remove any stale decline button
  const old = document.getElementById('btn-decline');
  if (old) old.remove();

  // Save multiplayer game — delay 2s so opponent_profile has time to arrive
  if (sb && currentUser && multiMoveHistory.length > 0) {
    var pgn = '';
    multiMoveHistory.forEach(function(uci, i) {
      if (i % 2 === 0) pgn += (Math.floor(i/2) + 1) + '. ';
      pgn += uci + ' ';
    });
    var savedPgn    = pgn.trim();
    var savedResult = result;
    var savedColor  = myColor;
    setTimeout(function() {
      sb.from('games').insert({
        user_id:      currentUser.id,
        pgn:          savedPgn,
        result:       savedResult,
        player_color: savedColor,
        opponent:     opponentUsername ? 'human:' + opponentUsername : 'human',
        player_elo_before: myProfile ? (myProfile.eloBefore || myProfile.elo) : null,
        player_elo_after:  myProfile ? myProfile.elo : null,
      }).then(function(res) {
        if (res.error) console.error('Multiplayer save failed:', res.error.message);
        else console.log('Multiplayer game saved. Opponent:', opponentUsername);
      });
    }, 2000);
  }
  // Reset for next game
  multiMoveHistory = [];
}

// ═══════════════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════════════
function resign() {
  if (gameOver || !gameWs) return;
  if (confirm('Resign this game?')) {
    sendGame({ type: 'resign' });
  }
}

function offerDraw() {
  if (gameOver || !gameWs) return;
  sendGame({ type: 'draw_offer' });
  showGameStatus('Draw offered.');
}

function goToLobby() {
  gameOver = true;
  stopClockTick();
  if (gameWs) { gameWs.close(); gameWs = null; }
  gameId = null; myColor = null;
  document.getElementById('overlay').classList.remove('active');
  connectLobby();
}

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════
bootAuth();
</script>

    <div class="promo-title">Promote pawn to</div>
    <div class="promo-pieces" id="promo-pieces"></div>
  </div>
</div>
