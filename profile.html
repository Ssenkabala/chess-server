  <style>
    :root {
      --bg:    #262624;
      --bg2:   #111;
      --bg3:   #33312d;
      --border:#222;
      --text:  #ece6da;
      --muted: #8d8d8d;
      --green: #4a9d7e;
      --red:   #ff4d4d;
      --gold:  #c9a76c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      background-image: url('/chess_pattern_bg.svg');
      background-repeat: repeat-y;
      background-size: 100% auto;
      background-position: top center;
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ── Nav ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 2px solid #c9a76c66;
      position: sticky; top: 0;
      background: #0a0a0aee;
      z-index: 10;
    }
    .top-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
      font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a {
      color: var(--muted); font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; text-decoration: none; cursor: pointer;
    }
    .nav-links a:hover { color: var(--green); }

    /* ── Page layout ── */
    .page { max-width: 720px; margin: 0 auto; padding: 24px 16px; }

    /* ── Avatar + header ── */
    .profile-header {
      display: flex; align-items: center; gap: 20px;
      padding: 24px; background: var(--bg2);
      border: 1px solid #c9a76c; border-radius: 4px;
      margin-bottom: 20px;
    }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--bg3); border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: var(--green); letter-spacing: 0;
      flex-shrink: 0;
    }
    .profile-info { flex: 1; }
    .profile-username {
      font-size: 22px; color: var(--text); letter-spacing: 0.08em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .profile-elo {
      font-size: 28px; color: var(--green); font-weight: bold;
      letter-spacing: 0.05em;
    }
    .profile-elo span { font-size: 13px; color: var(--muted); margin-left: 6px; }
    .profile-since {
      font-size: 11px; color: var(--muted); letter-spacing: 0.1em;
      text-transform: uppercase; margin-top: 6px;
    }

    /* ── Stats grid ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--bg2); border: 1px solid #c9a76c88;
      border-radius: 4px; padding: 16px 12px; text-align: center;
    }
    .stat-val { font-size: 24px; color: var(--text); margin-bottom: 4px; }
    .stat-val.green { color: var(--green); }
    .stat-val.red   { color: var(--red); }
    .stat-val.gold  { color: var(--gold); }
    .stat-lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }

    /* ── Section ── */
    .section {
      background: var(--bg2); border: 1px solid #c9a76c88;
      border-radius: 4px; margin-bottom: 20px; overflow: hidden;
    }
    .section-header {
      padding: 14px 18px; border-bottom: 1px solid #c9a76c88;
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted);
    }
    .section-body { padding: 18px; }

    /* ── Medal cabinet ── */
    .medal-grid {
      display: flex; flex-wrap: wrap; gap: 14px;
    }
    .medal-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; width: 90px; text-align: center;
      cursor: default; position: relative;
    }
    .medal-img {
      width: 72px; height: 72px; border-radius: 50%;
      object-fit: cover; transition: transform 0.2s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }
    .medal-item:hover .medal-img { transform: scale(1.08); }
    .medal-count {
      position: absolute; top: -4px; right: 6px;
      background: var(--green); color: #000;
      font-size: 10px; font-weight: bold;
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .medal-label {
      font-size: 10px; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase;
      line-height: 1.3;
    }
    .medal-reason {
      font-size: 10px; color: #444; line-height: 1.3;
      max-width: 90px;
    }
    .medal-empty {
      font-size: 12px; color: var(--muted);
      padding: 8px 0; line-height: 1.6;
    }
    .medal-tooltip {
      display: none;
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      background: #33312d; border: 1px solid #333;
      border-radius: 4px; padding: 8px 12px;
      font-size: 11px; color: #ccc; white-space: nowrap;
      z-index: 50; pointer-events: none;
      min-width: 180px; max-width: 240px;
      white-space: normal; line-height: 1.5; text-align: left;
    }
    .medal-item:hover .medal-tooltip,
    .medal-item.tooltip-open .medal-tooltip { display: block; }

    /* ── ELO chart ── */
    .chart-wrap { position: relative; height: 180px; }

    /* ── Coach section ── */
    .coach-usage {
      display: flex; align-items: center; gap: 16px; margin-bottom: 16px;
    }
    .usage-bar-wrap { flex: 1; }
    .usage-bar-bg {
      height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden;
    }
    .usage-bar-fill {
      height: 100%; background: var(--green); border-radius: 3px;
      transition: width 0.4s ease;
    }
    .usage-bar-fill.warning { background: #ff9d00; }
    .usage-bar-fill.danger  { background: var(--red); }
    .usage-count {
      font-size: 20px; color: var(--green); white-space: nowrap;
    }
    .usage-count.warning { color: #ff9d00; }
    .usage-count.danger  { color: var(--red); }
    .upgrade-box {
      background: var(--bg3); border: 1px solid #333;
      border-radius: 4px; padding: 14px 16px;
      font-size: 12px; color: var(--muted); line-height: 1.6;
    }
    .upgrade-box strong { color: var(--text); }

    /* ── Recent games ── */
    .game-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid #c9a76c55;
      font-size: 12px;
    }
    .game-row:last-child { border-bottom: none; }
    .game-result {
      width: 32px; height: 32px; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: bold; flex-shrink: 0;
    }
    .game-result.win  { background: #4a9d7e22; color: var(--green); }
    .game-result.loss { background: #ff4d4d22; color: var(--red); }
    .game-result.draw { background: #55555522; color: #9d9d9d; }
    .game-info { flex: 1; }
    .game-opp  { color: var(--text); margin-bottom: 2px; }
    .game-meta { color: var(--muted); font-size: 10px; letter-spacing: 0.08em; }
    .game-elo  { color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap; }
    .game-elo.pos { color: var(--green); }
    .game-elo.neg { color: var(--red); }

    /* ── Loading ── */
    .loading {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 13px; letter-spacing: 0.1em;
    }
    .not-signed-in {
      text-align: center; padding: 80px 20px;
      color: var(--muted);
    }
    .not-signed-in h2 { color: var(--text); margin-bottom: 12px; }
    .btn {
      display: inline-block; padding: 10px 24px;
      background: var(--green); color: #000;
      font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
      text-decoration: none; cursor: pointer; border: none;
      font-family: 'Georgia', serif;
    }

    /* ── Country selector ── */
    .country-row {
      display: flex; align-items: center; gap: 12px;
      margin-top: 10px;
    }
    .country-select {
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-family: Georgia,serif; font-size: 12px;
      padding: 6px 10px; border-radius: 3px; cursor: pointer;
      letter-spacing: 0.05em; flex: 1;
    }
    .country-select:focus { outline: none; border-color: var(--green); }
    .btn-save-country {
      padding: 6px 16px; background: var(--green); color: #000;
      border: none; font-family: Georgia,serif; font-size: 11px;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; white-space: nowrap;
    }
    .country-saved { font-size: 11px; color: var(--green); letter-spacing: 0.08em; }

    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .profile-header { flex-direction: column; text-align: center; }
    }
  </style>
</head>

<div id="afri-banner" role="alert">
  <span id="afri-banner-msg"></span>
  <button id="afri-banner-close" onclick="afriBannerDismiss()" aria-label="Dismiss">×</button>
</div>
<script>
(function() {
  var POLL_INTERVAL = 5 * 60 * 1000; // re-check every 5 minutes

  function afriBannerDismiss() {
    var el = document.getElementById('afri-banner');
    if (!el) return;
    var nid = el.dataset.nid;
    if (nid) localStorage.setItem('afri_banner_dismissed_' + nid, '1');
    el.style.display = 'none';
  }
  window.afriBannerDismiss = afriBannerDismiss;

  function afriBannerShow(n) {
    if (!n || !n.message) return;
    if (localStorage.getItem('afri_banner_dismissed_' + n.id)) return;
    var el  = document.getElementById('afri-banner');
    var msg = document.getElementById('afri-banner-msg');
    if (!el || !msg) return;
    el.className = n.type || 'info';
    el.dataset.nid = n.id;
    msg.textContent = n.message;
    el.style.display = 'block';
  }

  function afriBannerPoll() {
    fetch('/api/notification')
      .then(function(r) { return r.json(); })
      .then(function(d) { if (d && d.notification) afriBannerShow(d.notification); })
      .catch(function() {});  // fail silently
  }

  afriBannerPoll();
  setInterval(afriBannerPoll, POLL_INTERVAL);
})();
</script>

<script>
const SUPABASE_URL = 'https://nbskgzsvygdmlvwbetxn.supabase.co';
const SUPABASE_ANON = 'sb_publishable_g5BEYnjhPatfmnHG3jNQTQ_fzgKOy4s';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let currentUser = null;
let eloChart = null;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    document.getElementById('nav-signin').style.display = 'block';
    document.getElementById('mob-signin').style.display = 'block';
    showNotSignedIn();
    return;
  }
  currentUser = session.user;
  document.getElementById('nav-signout').style.display = 'block';
  document.getElementById('mob-signout').style.display = 'block';
  await loadProfile();
  loadMedals();
}

function showNotSignedIn() {
  document.getElementById('page-content').innerHTML = `
    <div class="not-signed-in">
      <h2>Sign in to view your profile</h2>
      <p style="margin-bottom:24px;font-size:13px;">Track your ELO, coach usage, and game history.</p>
      <button onclick="openAuth()" class="btn" style="cursor:pointer;border:none;">Sign In</button>
    </div>`;
}

function openAuth() {
  const ov = document.getElementById('auth-overlay');
  if (ov) { ov.classList.add('active'); setTimeout(()=>document.getElementById('auth-email')?.focus(),100); }
}
function closeAuth() { document.getElementById('auth-overlay')?.classList.remove('active'); }
let _authMode = 'signin';
function toggleAuthMode() {
  _authMode = _authMode==='signin'?'signup':'signin';
  const isSI = _authMode==='signin';
  document.getElementById('auth-title').textContent = isSI?'Sign In':'Create Account';
  document.getElementById('auth-submit-btn').textContent = isSI?'Sign In':'Create Account';
  document.getElementById('auth-toggle').innerHTML = isSI
    ? 'No account? <span onclick="toggleAuthMode()">Create one</span>'
    : 'Already have one? <span onclick="toggleAuthMode()">Sign in</span>';
  document.getElementById('auth-error').textContent='';
}
async function handleAuth() {
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-password').value;
  const errEl=document.getElementById('auth-error');
  errEl.textContent='';
  if (!email||!pass){errEl.textContent='Please enter email and password.';return;}
  const btn=document.getElementById('auth-submit-btn');
  btn.textContent='Please wait…';btn.disabled=true;
  const result=_authMode==='signin'
    ?await sb.auth.signInWithPassword({email,password:pass})
    :await sb.auth.signUp({email,password:pass});
  btn.disabled=false;btn.textContent=_authMode==='signin'?'Sign In':'Create Account';
  if(result.error){errEl.textContent=result.error.message;}
  else if(_authMode==='signup'){errEl.style.color='#4a9d7e';errEl.textContent='Check your email to confirm your account.';}
  else{closeAuth();window.location.reload();}
}
async function signInWithGoogle2() {
  await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://www.africhess.org/profile'}});
}

async function loadMedals() {
  if (!currentUser) return;
  const el = document.getElementById('medals-body');
  if (!el) return;
  try {
    const r = await fetch(`/api/medals/${currentUser.id}`);
    if (!r.ok) throw new Error('Failed');
    const data = await r.json();
    const medals = data.medals || [];
    renderMedals(medals, el);
  } catch(e) {
    if (el) el.innerHTML = '<div class="medal-empty">Could not load medals.</div>';
  }
}

const MEDAL_IMG = {
  pioneer:  '/img/medals/pioneer_200.jpg',
  bronze:   '/img/medals/bronze_200.jpg',
  silver:   '/img/medals/silver_200.jpg',
  gold:     '/img/medals/gold_200.jpg',
  platinum: '/img/medals/platinum_200.jpg',
  diamond:  '/img/medals/diamond_200.jpg',
};
const MEDAL_LABEL = {
  pioneer: '1st 100 Founder',
  bronze: 'Bronze Lion', silver: 'Silver Lion', gold: 'Gold Lion',
  platinum: 'Platinum Lion', diamond: 'Diamond Lion',
};

function renderMedals(medals, el) {
  if (!medals.length) {
    el.innerHTML = '<div class="medal-empty">No medals yet.<br>Win a tournament to earn your first Lion.</div>';
    return;
  }

  // Group by medal id, most recent first per group
  const groups = {};
  medals.forEach(m => {
    if (!groups[m.id]) groups[m.id] = [];
    groups[m.id].push(m);
  });

  // Order: pioneer (founder) → diamond → platinum → gold → silver → bronze
  const order = ['pioneer', 'diamond', 'platinum', 'gold', 'silver', 'bronze'];
  let html = '<div class="medal-grid">';
  order.forEach(id => {
    if (!groups[id]) return;
    const list = groups[id];
    const count = list.length;

// Compute the rating change over the last 7 days for one TC.
// Uses the tc_histories data already returned by the API — no extra call.
// Follows Lichess's progresses pattern: find the earliest data point
// within the 7-day window, compare its ELO to the most recent point.
// Returns null if there are fewer than 2 points in the window.
function weekProgress(historyPoints) {
  if (!historyPoints || historyPoints.length < 2) return null;
  const sevenDaysAgo = new Date();
  sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
  const cutoff = sevenDaysAgo.toISOString().slice(0, 10);
  // Filter to only points within the last 7 days
  const inWindow = historyPoints.filter(p => p.date >= cutoff);
  if (inWindow.length < 2) return null;
  const oldest = inWindow[0].elo;
  const newest = inWindow[inWindow.length - 1].elo;
  return newest - oldest;
}

// Format a progress delta as "+12 ↑" / "−8 ↓" / "0" with appropriate color.
function progressBadge(delta) {
  if (delta === null || delta === 0) return '';
  const sign  = delta > 0 ? '+' : '';
  const arrow = delta > 0 ? '↑' : '↓';
  const color = delta > 0 ? '#4a9d7e' : '#ff5555';
  return `<span style="font-size:11px;color:${color};font-weight:600;margin-left:5px;">${sign}${delta} ${arrow}</span>`;
}

function drawMultiEloChart(tcHistories) {
  if (eloChart) { eloChart.destroy(); eloChart = null; }

  const TC_STYLES = {
    bullet:    { color: '#4a9d7e', dash: [],        label: 'Bullet'    },
    blitz:     { color: '#f9a825', dash: [],        label: 'Blitz'     },
    rapid:     { color: '#29b6f6', dash: [6, 3],    label: 'Rapid'     },
    classical: { color: '#ce93d8', dash: [2, 4],    label: 'Classical' },
  };

  // Build a merged, sorted label set across all TCs
  const allDates = new Set();
  for (const tc of Object.keys(TC_STYLES)) {
    for (const p of (tcHistories[tc] || [])) allDates.add(p.date);
  }
  const labels = [...allDates].sort();

  const datasets = [];
  let hasAnyData = false;

  for (const [tc, style] of Object.entries(TC_STYLES)) {
    const pts = tcHistories[tc] || [];
    if (pts.length < 1) continue;   // need at least 1 point
    hasAnyData = true;

    // Map date → elo; for dates where TC has no game, interpolate (null = gap)
    const dateMap = Object.fromEntries(pts.map(p => [p.date, p.elo]));
    const data = labels.map(d => dateMap[d] !== undefined ? dateMap[d] : null);

    datasets.push({
      label:              style.label,
      data,
      borderColor:        style.color,
      backgroundColor:    'transparent',
      borderWidth:        pts.length > 1 ? 2 : 0,   // no line for single point
      borderDash:         style.dash,
      pointRadius:        pts.length > 1 ? 3 : 6,   // bigger dot if only one game
      pointBackgroundColor: style.color,
      tension:            0.3,
      spanGaps:           false,
    });
  }

  const emptyEl = document.getElementById('chart-empty');
  const chartArea = document.getElementById('multi-chart-area');

  if (!hasAnyData) {
    if (chartArea) chartArea.style.display = 'none';
    if (emptyEl)   emptyEl.style.display   = '';
    return;
  }
  if (chartArea) chartArea.style.display = '';
  if (emptyEl)   emptyEl.style.display   = 'none';

  const ctx = document.getElementById('elo-chart').getContext('2d');
  eloChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive:          true,
      maintainAspectRatio: false,
      interaction:         { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },   // we draw our own legend above
        tooltip: {
          backgroundColor: '#33312d',
          borderColor:     '#333',
          borderWidth:     1,
          titleColor:      '#ece6da',
          bodyColor:       '#aaa',
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y}`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#555', font: { size: 10 }, maxRotation: 0, maxTicksLimit: 8 },
          grid:  { color: '#33312d' }
        },
        y: {
          ticks: { color: '#555', font: { size: 10 } },
          grid:  { color: '#33312d' }
        }
      }
    }
  });
}

function renderGameRow(g) {
  const isWin  = g.result === g.player_color;
  const isDraw = g.result === 'draw';
  const resultClass = isWin ? 'win' : isDraw ? 'draw' : 'loss';
  const resultLabel = isWin ? 'W' : isDraw ? 'D' : 'L';

  const opp = formatOpponent(g.opponent);
  const date = g.created_at ? new Date(g.created_at).toLocaleDateString('en-GB', {day:'numeric',month:'short'}) : '';
  const moves = (g.pgn ? (g.pgn.match(/\d+\./g) || []).length : 0);

  let eloStr = '';
  let eloClass = '';
  if (g.player_elo_before && g.player_elo_after) {
    const diff = g.player_elo_after - g.player_elo_before;
    eloStr = (diff >= 0 ? '+' : '') + diff;
    eloClass = diff >= 0 ? 'pos' : 'neg';
  }

  return `
    <div class="game-row">
      <div class="game-result ${resultClass}">${resultLabel}</div>
      <div class="game-info">
        <div class="game-opp">vs ${opp}</div>
        <div class="game-meta">As ${g.player_color || '?'} · ${moves} moves · ${date}</div>
      </div>
      ${eloStr ? `<div class="game-elo ${eloClass}">${eloStr}</div>` : ''}
    </div>`;
}

function formatOpponent(opponent) {
  if (!opponent) return 'Engine';
  if (opponent.startsWith('human:')) return opponent.replace('human:', '');
  if (opponent === 'human') return 'Human';
  if (opponent.startsWith('engine_lvl_')) {
    const lvl = opponent.replace('engine_lvl_', '');
    const labels = {'1':'Beginner','2':'Beginner+','3':'Easy','4':'Intermediate','5':'Hard','6':'Hard+','7':'Expert','8':'Master'};
    return 'Engine · ' + (labels[lvl] || 'Lvl ' + lvl);
  }
  return opponent;
}

async function saveGender() {
  const sel = document.getElementById('gender-select');
  if (!sel) return;
  const val = sel.value;
  if (!val) { alert('Please select a gender.'); return; }

  // Confirmation warning — this is permanent
  const labels = { male: 'Male', female: 'Female', prefer_not_to_say: 'Prefer not to say' };
  const confirmed = confirm(
    `Set your gender to "${labels[val] || val}"?\n\nThis cannot be changed after saving.`
  );
  if (!confirmed) return;

  const btn = document.getElementById('btn-save-gender');
  if (btn) btn.disabled = true;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const r = await fetch('/api/update-gender', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
    body: JSON.stringify({ gender: val })
  });
  if (r.ok) {
    // Replace dropdown with locked display — same pattern as country
    const row = document.getElementById('gender-row');
    if (row) {
      row.innerHTML = `<span style="font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;">
        <span>${labels[val] || val}</span>
        <span style="font-size:10px;color:#333;letter-spacing:0.1em;text-transform:uppercase;margin-left:4px;">🔒 locked</span>
      </span>`;
    }
  } else {
    const data = await r.json().catch(() => ({}));
    const msg = data.detail || 'Failed to save gender.';
    alert(msg);
    // If already locked, reload profile to show correct locked state
    if (msg.includes('locked')) {
      setTimeout(() => loadProfile(), 500);
    } else {
      if (btn) btn.disabled = false;
    }
  }
}

  // Confirmation warning — this is permanent
  const confirmed = confirm(
    `Set your country to "${COUNTRY_NAMES[val] || val}"?\n\nThis cannot be changed after saving.`
  );
  if (!confirmed) return;

  btn.disabled = true;
  btn.textContent = '...';
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { openAuth(); btn.disabled=false; btn.textContent='Save'; return; }
  try {
    const r = await fetch('/api/update-country', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
                 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ country: val })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Update failed');
    _currentCountry = val;
    // Replace dropdown with locked display immediately
    const row = document.getElementById('country-row');
    if (row) {
      row.innerHTML = `<span style="font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;">
        <span>${COUNTRY_NAMES[val] || val}</span>
        <span style="font-size:10px;color:#333;letter-spacing:0.1em;text-transform:uppercase;margin-left:4px;">🔒 locked</span>
      </span>`;
    }
  } catch (err) {
    btn.textContent = 'Save';
    btn.disabled = false;
    alert('Could not save: ' + err.message);
  }
}

function setCountryDropdown(country) {
  if (!country) return;
  _currentCountry = country;
  // If locked display is shown, populate its label
  const flagEl = document.getElementById('country-flag-label');
  if (flagEl) {
    flagEl.textContent = COUNTRY_NAMES[country] || country;
    return;
  }
  // Otherwise set the dropdown value (shouldn't happen if country is set — template handles it)
  const sel = document.getElementById('country-select');
  if (sel) sel.value = country;
}

function toggleMobileNav() {
  const d = document.getElementById('mobile-drawer');
  const o = document.getElementById('drawer-overlay');
  d.style.right = d.style.right === '0px' ? '-260px' : '0px';
  o.style.display = o.style.display === 'block' ? 'none' : 'block';
}

async function signOut() {
  await sb.auth.signOut();
  window.location.href = '/';
}

init();
</script>
