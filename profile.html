<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile · AfriChess</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Your AfriChess profile — ELO rating, win stats, coach usage, and game history.">
  <meta property="og:title" content="AfriChess — Profile">
  <meta property="og:image" content="https://www.africhess.org/android-chrome-512x512.png">
  <meta property="og:url" content="https://www.africhess.org/profile">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    :root {
      --bg:    #0d0d0d;
      --bg2:   #111;
      --bg3:   #1a1a1a;
      --border:#222;
      --text:  #e8e6e0;
      --muted: #555;
      --green: #00ff9d;
      --red:   #ff4d4d;
      --gold:  #d4af37;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ── Nav ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .top-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
      font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a {
      color: var(--muted); font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; text-decoration: none; cursor: pointer;
    }
    .nav-links a:hover { color: var(--green); }

    /* ── Page layout ── */
    .page { max-width: 720px; margin: 0 auto; padding: 24px 16px; }

    /* ── Avatar + header ── */
    .profile-header {
      display: flex; align-items: center; gap: 20px;
      padding: 24px; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 4px;
      margin-bottom: 20px;
    }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--bg3); border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: var(--green); letter-spacing: 0;
      flex-shrink: 0;
    }
    .profile-info { flex: 1; }
    .profile-username {
      font-size: 22px; color: var(--text); letter-spacing: 0.08em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .profile-elo {
      font-size: 28px; color: var(--green); font-weight: bold;
      letter-spacing: 0.05em;
    }
    .profile-elo span { font-size: 13px; color: var(--muted); margin-left: 6px; }
    .profile-since {
      font-size: 11px; color: var(--muted); letter-spacing: 0.1em;
      text-transform: uppercase; margin-top: 6px;
    }

    /* ── Stats grid ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; padding: 16px 12px; text-align: center;
    }
    .stat-val { font-size: 24px; color: var(--text); margin-bottom: 4px; }
    .stat-val.green { color: var(--green); }
    .stat-val.red   { color: var(--red); }
    .stat-val.gold  { color: var(--gold); }
    .stat-lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }

    /* ── Section ── */
    .section {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; margin-bottom: 20px; overflow: hidden;
    }
    .section-header {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted);
    }
    .section-body { padding: 18px; }

    /* ── Medal cabinet ── */
    .medal-grid {
      display: flex; flex-wrap: wrap; gap: 14px;
    }
    .medal-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; width: 90px; text-align: center;
      cursor: default; position: relative;
    }
    .medal-img {
      width: 72px; height: 72px; border-radius: 50%;
      object-fit: cover; transition: transform 0.2s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }
    .medal-item:hover .medal-img { transform: scale(1.08); }
    .medal-item.pioneer-badge .medal-img {
      border-radius: 50%;
      box-shadow: 0 0 0 2px #d4af37, 0 4px 18px rgba(212,175,55,0.35);
    }
    .medal-item.pioneer-badge .medal-label {
      color: #d4af37;
    }
    .medal-count {
      position: absolute; top: -4px; right: 6px;
      background: var(--green); color: #000;
      font-size: 10px; font-weight: bold;
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .medal-label {
      font-size: 10px; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase;
      line-height: 1.3;
    }
    .medal-reason {
      font-size: 10px; color: #444; line-height: 1.3;
      max-width: 90px;
    }
    .medal-empty {
      font-size: 12px; color: var(--muted);
      padding: 8px 0; line-height: 1.6;
    }
    .medal-tooltip {
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 4px; padding: 8px 10px;
      font-size: 11px; color: #ccc; white-space: nowrap;
      z-index: 50; pointer-events: none; opacity: 0;
      transition: opacity 0.15s; min-width: 160px; text-align: left;
    }
    .medal-item:hover .medal-tooltip { opacity: 1; }

    /* ── ELO chart ── */
    .chart-wrap { position: relative; height: 180px; }

    /* ── Coach section ── */
    .coach-usage {
      display: flex; align-items: center; gap: 16px; margin-bottom: 16px;
    }
    .usage-bar-wrap { flex: 1; }
    .usage-bar-bg {
      height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden;
    }
    .usage-bar-fill {
      height: 100%; background: var(--green); border-radius: 3px;
      transition: width 0.4s ease;
    }
    .usage-bar-fill.warning { background: #ff9d00; }
    .usage-bar-fill.danger  { background: var(--red); }
    .usage-count {
      font-size: 20px; color: var(--green); white-space: nowrap;
    }
    .usage-count.warning { color: #ff9d00; }
    .usage-count.danger  { color: var(--red); }
    .upgrade-box {
      background: var(--bg3); border: 1px solid #333;
      border-radius: 4px; padding: 14px 16px;
      font-size: 12px; color: var(--muted); line-height: 1.6;
    }
    .upgrade-box strong { color: var(--text); }

    /* ── Recent games ── */
    .game-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .game-row:last-child { border-bottom: none; }
    .game-result {
      width: 32px; height: 32px; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: bold; flex-shrink: 0;
    }
    .game-result.win  { background: #00ff9d22; color: var(--green); }
    .game-result.loss { background: #ff4d4d22; color: var(--red); }
    .game-result.draw { background: #55555522; color: #888; }
    .game-info { flex: 1; }
    .game-opp  { color: var(--text); margin-bottom: 2px; }
    .game-meta { color: var(--muted); font-size: 10px; letter-spacing: 0.08em; }
    .game-elo  { color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap; }
    .game-elo.pos { color: var(--green); }
    .game-elo.neg { color: var(--red); }

    /* ── Loading ── */
    .loading {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 13px; letter-spacing: 0.1em;
    }
    .not-signed-in {
      text-align: center; padding: 80px 20px;
      color: var(--muted);
    }
    .not-signed-in h2 { color: var(--text); margin-bottom: 12px; }
    .btn {
      display: inline-block; padding: 10px 24px;
      background: var(--green); color: #000;
      font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
      text-decoration: none; cursor: pointer; border: none;
      font-family: 'Georgia', serif;
    }

    /* ── Country selector ── */
    .country-row {
      display: flex; align-items: center; gap: 12px;
      margin-top: 10px;
    }
    .country-select {
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-family: Georgia,serif; font-size: 12px;
      padding: 6px 10px; border-radius: 3px; cursor: pointer;
      letter-spacing: 0.05em; flex: 1;
    }
    .country-select:focus { outline: none; border-color: var(--green); }
    .btn-save-country {
      padding: 6px 16px; background: var(--green); color: #000;
      border: none; font-family: Georgia,serif; font-size: 11px;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; white-space: nowrap;
    }
    .country-saved { font-size: 11px; color: var(--green); letter-spacing: 0.08em; }

    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .profile-header { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="/" class="top-logo">
    <img src="/logo.png" height="28" alt="AfriChess">
    <span>Afri<span style="color:#00ff9d">Chess</span></span>
  </a>
  <div class="nav-links" id="nav-links-desktop">
    <a href="/">Home</a>
    <a href="/play">vs Bot</a>
    <a href="/multiplayer">Live</a>
    <a href="/tournaments">Tournaments</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/puzzles">Puzzles</a>
    <a href="/history">History</a>
    <a href="/profile" style="color:var(--green)">Profile</a>
    <a id="nav-signin" onclick="openAuth()" style="display:none;cursor:pointer;">Sign In</a>
    <a id="nav-signout" onclick="signOut()" style="display:none;cursor:pointer;">Sign Out</a>
  </div>
  <button id="hamburger" onclick="toggleMobileNav()" style="display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px;">
    <span style="display:block;width:22px;height:2px;background:#888;pointer-events:none;"></span>
    <span style="display:block;width:22px;height:2px;background:#888;pointer-events:none;"></span>
    <span style="display:block;width:22px;height:2px;background:#888;pointer-events:none;"></span>
  </button>
</div>
<div id="mobile-drawer" style="position:fixed;top:0;right:-260px;width:240px;height:100vh;background:#0d0d0d;border-left:1px solid #1a1a1a;display:flex;flex-direction:column;padding:72px 24px 32px;gap:20px;z-index:500;transition:right 0.28s ease;">
  <a href="/" style="color:#555;text-decoration:none;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #1a1a1a;">Home</a>
  <a href="/play" style="color:#555;text-decoration:none;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #1a1a1a;">vs Bot</a>
  <a href="/multiplayer" style="color:#555;text-decoration:none;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #1a1a1a;">Live</a>
  <a href="/tournaments" style="color:#555;text-decoration:none;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #1a1a1a;">Tournaments</a>
  <a href="/leaderboard" style="color:#555;text-decoration:none;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #1a1a1a;">Leaderboard</a>
  <a href="/puzzles" style="color:#555;text-decoration:none;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #1a1a1a;">Puzzles</a>
  <a href="/history" style="color:#555;text-decoration:none;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #1a1a1a;">History</a>
  <a href="/profile" style="color:var(--green);text-decoration:none;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #1a1a1a;">Profile</a>
  <a id="mob-signin" onclick="toggleMobileNav();openAuth();" style="display:none;color:#00ff9d;text-decoration:none;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #1a1a1a;cursor:pointer;">Sign In</a>
  <a id="mob-signout" onclick="signOut()" style="display:none;color:#555;text-decoration:none;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #1a1a1a;cursor:pointer;">Sign Out</a>
</div>
<div id="drawer-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:499;" onclick="toggleMobileNav()"></div>
<style>
@media (max-width:768px) { #nav-links-desktop { display:none !important; } #hamburger { display:flex !important; } }
</style>

<div class="page" id="page-content">
  <div class="loading">Loading profile…</div>
</div>

<script>
const SUPABASE_URL = 'https://nbskgzsvygdmlvwbetxn.supabase.co';
const SUPABASE_ANON = 'sb_publishable_g5BEYnjhPatfmnHG3jNQTQ_fzgKOy4s';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let currentUser = null;
let eloChart = null;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    document.getElementById('nav-signin').style.display = 'block';
    document.getElementById('mob-signin').style.display = 'block';
    showNotSignedIn();
    return;
  }
  currentUser = session.user;
  document.getElementById('nav-signout').style.display = 'block';
  document.getElementById('mob-signout').style.display = 'block';
  await loadProfile();
  loadMedals();
}

function showNotSignedIn() {
  document.getElementById('page-content').innerHTML = `
    <div class="not-signed-in">
      <h2>Sign in to view your profile</h2>
      <p style="margin-bottom:24px;font-size:13px;">Track your ELO, coach usage, and game history.</p>
      <button onclick="openAuth()" class="btn" style="cursor:pointer;border:none;">Sign In</button>
    </div>`;
}

function openAuth() {
  const ov = document.getElementById('auth-overlay');
  if (ov) { ov.classList.add('active'); setTimeout(()=>document.getElementById('auth-email')?.focus(),100); }
}
function closeAuth() { document.getElementById('auth-overlay')?.classList.remove('active'); }
let _authMode = 'signin';
function toggleAuthMode() {
  _authMode = _authMode==='signin'?'signup':'signin';
  const isSI = _authMode==='signin';
  document.getElementById('auth-title').textContent = isSI?'Sign In':'Create Account';
  document.getElementById('auth-submit-btn').textContent = isSI?'Sign In':'Create Account';
  document.getElementById('auth-toggle').innerHTML = isSI
    ? 'No account? <span onclick="toggleAuthMode()">Create one</span>'
    : 'Already have one? <span onclick="toggleAuthMode()">Sign in</span>';
  document.getElementById('auth-error').textContent='';
}
async function handleAuth() {
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-password').value;
  const errEl=document.getElementById('auth-error');
  errEl.textContent='';
  if (!email||!pass){errEl.textContent='Please enter email and password.';return;}
  const btn=document.getElementById('auth-submit-btn');
  btn.textContent='Please wait…';btn.disabled=true;
  const result=_authMode==='signin'
    ?await sb.auth.signInWithPassword({email,password:pass})
    :await sb.auth.signUp({email,password:pass});
  btn.disabled=false;btn.textContent=_authMode==='signin'?'Sign In':'Create Account';
  if(result.error){errEl.textContent=result.error.message;}
  else if(_authMode==='signup'){errEl.style.color='#00ff9d';errEl.textContent='Check your email to confirm your account.';}
  else{closeAuth();window.location.reload();}
}
async function signInWithGoogle2() {
  await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://www.africhess.org/profile'}});
}

async function loadMedals() {
  if (!currentUser) return;
  const el = document.getElementById('medals-body');
  if (!el) return;
  try {
    const r = await fetch(`/api/medals/${currentUser.id}`);
    if (!r.ok) throw new Error('Failed');
    const data = await r.json();
    const medals = data.medals || [];
    renderMedals(medals, el);
  } catch(e) {
    if (el) el.innerHTML = '<div class="medal-empty">Could not load medals.</div>';
  }
}

const MEDAL_IMG = {
  pioneer:  '/img/medals/pioneer_200.jpg',
  bronze:   '/img/medals/bronze_200.jpg',
  silver:   '/img/medals/silver_200.jpg',
  gold:     '/img/medals/gold_200.jpg',
  platinum: '/img/medals/platinum_200.jpg',
  diamond:  '/img/medals/diamond_200.jpg',
};
const MEDAL_LABEL = {
  pioneer:  '1st 100 Founder',
  bronze: 'Bronze Lion', silver: 'Silver Lion', gold: 'Gold Lion',
  platinum: 'Platinum Lion', diamond: 'Diamond Lion',
};

function renderMedals(medals, el) {
  if (!medals.length) {
    el.innerHTML = '<div class="medal-empty">No medals yet.<br>Win a tournament to earn your first Lion.</div>';
    return;
  }

  // Group by medal id, most recent first per group
  const groups = {};
  medals.forEach(m => {
    if (!groups[m.id]) groups[m.id] = [];
    groups[m.id].push(m);
  });

  // Order: pioneer (founder) → diamond → platinum → gold → silver → bronze
  const order = ['pioneer', 'diamond', 'platinum', 'gold', 'silver', 'bronze'];
  let html = '<div class="medal-grid">';
  order.forEach(id => {
    if (!groups[id]) return;
    const list = groups[id];
    const count = list.length;
    const latest = list[list.length - 1];  // most recently awarded
    const tooltipLines = list.slice(-3).reverse()
      .map(m => `<div style="margin-bottom:3px;">${m.reason || id}</div>`).join('');
    html += `
      <div class="medal-item${id === 'pioneer' ? ' pioneer-badge' : ''}">
        ${count > 1 ? `<div class="medal-count">×${count}</div>` : ''}
        <img class="medal-img" src="${MEDAL_IMG[id]}" alt="${MEDAL_LABEL[id]}" loading="lazy">
        <div class="medal-label">${MEDAL_LABEL[id]}</div>
        <div class="medal-tooltip">
          <div style="color:#00ff9d;font-weight:bold;margin-bottom:4px;">${MEDAL_LABEL[id]} ×${count}</div>
          ${tooltipLines}
        </div>
      </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

async function loadProfile() {
  try {
    const r = await fetch(`/api/profile/${currentUser.id}`, {
      headers: { 'x-user-id': currentUser.id }
    });
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    renderProfile(data);
    setCountryDropdown(data.country);
  } catch (e) {
    document.getElementById('page-content').innerHTML =
      `<div class="loading">Error loading profile: ${e.message}</div>`;
  }
}

function renderProfile(d) {
  _profileData = d;
  const initials = (d.username || '?').slice(0, 2).toUpperCase();
  const since = d.created_at ? new Date(d.created_at).toLocaleDateString('en-GB', {month:'short', year:'numeric'}) : '';
  const usagePct = Math.round((d.coach_uses_today / d.coach_limit) * 100);
  const usageClass = usagePct >= 100 ? 'danger' : usagePct >= 60 ? 'warning' : '';

  document.getElementById('page-content').innerHTML = `
    <!-- Header -->
    <div class="profile-header">
      <div class="avatar">${initials}</div>
      <div class="profile-info">
        <div class="profile-username">${d.username || 'Unknown'}</div>
        <div style="display:flex;gap:20px;margin:8px 0;flex-wrap:wrap;">
          <div>
            <div style="font-size:11px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:2px;">Bullet</div>
            <div class="profile-elo" style="font-size:22px;">${d.elo_bullet || 1500}</div>
          </div>
          <div style="border-left:1px solid var(--border);margin:0 4px;"></div>
          <div>
            <div style="font-size:11px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:2px;">Blitz</div>
            <div class="profile-elo" style="font-size:22px;">${d.elo_blitz || 1500}</div>
          </div>
          <div style="border-left:1px solid var(--border);margin:0 4px;"></div>
          <div>
            <div style="font-size:11px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:2px;">Rapid</div>
            <div class="profile-elo" style="font-size:22px;">${d.elo_rapid || 1500}</div>
          </div>
        </div>
        ${since ? `<div class="profile-since">Member since ${since}</div>` : ''}
        <div class="country-row" id="country-row">
          ${d.country
            ? `<span id="country-locked" style="font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;">
                <span id="country-flag-label"></span>
                <span style="font-size:10px;color:#333;letter-spacing:0.1em;text-transform:uppercase;margin-left:4px;">🔒 locked</span>
               </span>`
            : `<select class="country-select" id="country-select" onchange="countryChanged()">

function renderGameRow(g) {
  const isWin  = g.result === g.player_color;
  const isDraw = g.result === 'draw';
  const resultClass = isWin ? 'win' : isDraw ? 'draw' : 'loss';
  const resultLabel = isWin ? 'W' : isDraw ? 'D' : 'L';

  const opp = formatOpponent(g.opponent);
  const date = g.created_at ? new Date(g.created_at).toLocaleDateString('en-GB', {day:'numeric',month:'short'}) : '';
  const moves = (g.pgn ? (g.pgn.match(/\d+\./g) || []).length : 0);

  let eloStr = '';
  let eloClass = '';
  if (g.player_elo_before && g.player_elo_after) {
    const diff = g.player_elo_after - g.player_elo_before;
    eloStr = (diff >= 0 ? '+' : '') + diff;
    eloClass = diff >= 0 ? 'pos' : 'neg';
  }

  return `
    <div class="game-row">
      <div class="game-result ${resultClass}">${resultLabel}</div>
      <div class="game-info">
        <div class="game-opp">vs ${opp}</div>
        <div class="game-meta">As ${g.player_color || '?'} · ${moves} moves · ${date}</div>
      </div>
      ${eloStr ? `<div class="game-elo ${eloClass}">${eloStr}</div>` : ''}
    </div>`;
}

function formatOpponent(opponent) {
  if (!opponent) return 'Engine';
  if (opponent.startsWith('human:')) return opponent.replace('human:', '');
  if (opponent === 'human') return 'Human';
  if (opponent.startsWith('engine_lvl_')) {
    const lvl = opponent.replace('engine_lvl_', '');
    const labels = {'1':'Beginner','2':'Beginner+','3':'Easy','4':'Intermediate','5':'Hard','6':'Hard+','7':'Expert','8':'Master'};
    return 'Engine · ' + (labels[lvl] || 'Lvl ' + lvl);
  }
  return opponent;
}

function countryChanged() {
  const sel = document.getElementById('country-select');
  if (!sel) return;
  const btn = document.getElementById('btn-save-country');
  const saved = document.getElementById('country-saved');
  if (saved) saved.style.display = 'none';
  if (btn) btn.style.display = sel.value ? '' : 'none';
}

async function saveCountry() {
  const sel   = document.getElementById('country-select');
  const btn   = document.getElementById('btn-save-country');
  const saved = document.getElementById('country-saved');
  if (!sel) return;
  const val   = sel.value;
  if (!val) { alert('Please select a country.'); return; }
  btn.disabled = true;
  btn.textContent = '...';
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { openAuth(); btn.disabled=false; btn.textContent='Save'; return; }
  try {
    const r = await fetch('/api/update-country', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
                 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ country: val })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Update failed');
    _currentCountry = val;
    // Replace dropdown with locked display immediately
    const row = document.getElementById('country-row');
    if (row) {
      row.innerHTML = `<span style="font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;">
        <span>${COUNTRY_NAMES[val] || val}</span>
        <span style="font-size:10px;color:#333;letter-spacing:0.1em;text-transform:uppercase;margin-left:4px;">🔒 locked</span>
      </span>`;
    }
  } catch (err) {
    btn.textContent = 'Save';
    btn.disabled = false;
    alert('Could not save: ' + err.message);
  }
}

function setCountryDropdown(country) {
  if (!country) return;
  _currentCountry = country;
  // If locked display is shown, populate its label
  const flagEl = document.getElementById('country-flag-label');
  if (flagEl) {
    flagEl.textContent = COUNTRY_NAMES[country] || country;
    return;
  }
  // Otherwise set the dropdown value (shouldn't happen if country is set — template handles it)
  const sel = document.getElementById('country-select');
  if (sel) sel.value = country;
}

}
