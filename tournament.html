<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournaments · AfriChess</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:    #0d0d0d;
      --bg2:   #111;
      --bg3:   #1a1a1a;
      --border:#222;
      --text:  #e8e6e0;
      --muted: #555;
      --green: #00ff9d;
      --red:   #ff4d4d;
      --gold:  #d4af37;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ── Nav ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .top-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
      font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a {
      color: var(--muted); font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; text-decoration: none; cursor: pointer;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--green); }

    /* ── Page ── */
    .page { max-width: 900px; margin: 0 auto; padding: 28px 16px; }

    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
    }
    .page-title {
      font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--muted);
    }
    .page-title span { color: var(--green); }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .tab {
      padding: 10px 20px; font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--muted); cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.2s;
      background: none; border-top: none; border-left: none; border-right: none;
      font-family: Georgia, serif;
    }
    .tab.active { color: var(--green); border-bottom-color: var(--green); }
    .tab:hover { color: var(--text); }

    /* ── Tournament cards ── */
    .t-grid { display: flex; flex-direction: column; gap: 12px; }
    .t-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; padding: 18px 20px;
      display: flex; align-items: center; gap: 16px;
      transition: border-color 0.2s; cursor: pointer;
    }
    .t-card:hover { border-color: #333; }
    .t-card.upcoming { border-left: 3px solid var(--gold); }
    .t-card.active   { border-left: 3px solid var(--green); }
    .t-card.completed{ border-left: 3px solid #333; }

    .t-status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .t-status-dot.upcoming  { background: var(--gold); }
    .t-status-dot.active    { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .t-status-dot.completed { background: #333; }

    .t-info { flex: 1; min-width: 0; }
    .t-name {
      font-size: 15px; color: var(--text); margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .t-meta {
      font-size: 10px; color: var(--muted); letter-spacing: 0.1em;
      text-transform: uppercase; display: flex; gap: 14px; flex-wrap: wrap;
    }
    .t-meta span { display: flex; align-items: center; gap: 4px; }
    .t-right { text-align: right; flex-shrink: 0; }
    .t-players { font-size: 18px; color: var(--text); }
    .t-players-lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }
    .t-starts {
      font-size: 11px; color: var(--gold); letter-spacing: 0.06em; margin-top: 2px;
    }

    .btn { 
      display: inline-block; padding: 8px 20px;
      background: var(--green); color: #000; border: none;
      font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
      font-family: Georgia, serif; cursor: pointer; border-radius: 2px;
      text-decoration: none; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-outline {
      background: transparent; color: var(--green);
      border: 1px solid var(--green);
    }
    .btn-sm { padding: 5px 14px; font-size: 10px; }

    .empty {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 13px; letter-spacing: 0.08em;
    }

    /* ── Create modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 100;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; width: 100%; max-width: 480px;
      padding: 28px; position: relative;
    }
    .modal-title {
      font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 20px;
    }
    .modal-close {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 10px; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-family: Georgia, serif; font-size: 13px;
      padding: 9px 12px; border-radius: 3px;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: #00ff9d55;
    }
    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1; }
    .field textarea { resize: vertical; min-height: 60px; }

    /* ── Detail view ── */
    .detail { display: none; }
    .detail.active { display: block; }
    .list-view { display: block; }
    .list-view.hidden { display: none; }

    .detail-header {
      display: flex; align-items: flex-start; gap: 16px;
      margin-bottom: 24px; flex-wrap: wrap;
    }
    .detail-back {
      background: none; border: none; color: var(--muted);
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; font-family: Georgia, serif; padding: 0;
      margin-bottom: 16px; display: flex; align-items: center; gap: 6px;
    }
    .detail-back:hover { color: var(--text); }

    .detail-name { font-size: 22px; color: var(--text); margin-bottom: 6px; }
    .detail-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .tag {
      display: inline-block; padding: 3px 10px;
      border: 1px solid var(--border); border-radius: 2px;
      font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); margin-right: 6px; margin-bottom: 6px;
    }
    .tag.green { border-color: #00ff9d33; color: var(--green); }

    /* ── Players table ── */
    .section {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; margin-bottom: 16px; overflow: hidden;
    }
    .section-hdr {
      padding: 12px 18px; border-bottom: 1px solid var(--border);
      font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); display: flex; justify-content: space-between;
      align-items: center;
    }
    .player-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 18px; border-bottom: 1px solid #1a1a1a; font-size: 13px;
    }
    .player-row:last-child { border-bottom: none; }
    .player-rank { width: 24px; color: var(--muted); font-size: 11px; text-align: center; }
    .player-name { flex: 1; }
    .player-country { font-size: 14px; }
    .player-elo { color: var(--muted); font-size: 12px; }
    .player-score { color: var(--green); font-weight: bold; min-width: 30px; text-align: right; }

    /* ── Pairings ── */
    .pairing-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-bottom: 1px solid #1a1a1a;
      font-size: 12px;
    }
    .pairing-row:last-child { border-bottom: none; }
    .pairing-player { flex: 1; }
    .pairing-vs { color: var(--muted); font-size: 10px; letter-spacing: 0.1em; flex-shrink: 0; }
    .pairing-result {
      min-width: 60px; text-align: center; font-size: 11px;
      letter-spacing: 0.05em;
    }
    .pairing-result.pending { color: var(--muted); }
    .pairing-result.white-win { color: var(--green); }
    .pairing-result.black-win { color: var(--red); }
    .pairing-result.draw { color: #888; }

    .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 12px; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid #333; border-top-color: var(--green);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .t-card { flex-wrap: wrap; }
      .field-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>

<script>

// ── Timer countdown (survives detail-content polls) ──────────────
let _timerInterval = null;

function startTournamentTimer(t) {
  if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
  const bar = document.getElementById('arena-timer-bar');
  if (!bar) return;

  function fmt(ms) {
    if (ms <= 0) return '0:00';
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function tick() {
    const now = Date.now();
    if (t.status === 'upcoming') {
      const starts = new Date(t.starts_at).getTime();
      const ms = starts - now;
      if (ms <= 0) {
        bar.textContent = '⏳ Starting now…';
        bar.style.display = '';
        clearInterval(_timerInterval); _timerInterval = null;
        // Reload after a moment so status flips to active
        setTimeout(() => { if (currentDetailId) viewTournament(currentDetailId); }, 3000);
      } else {
        bar.style.display = '';
        bar.textContent = `⏳ Starts in ${fmt(ms)}`;
      }
    } else if (t.status === 'active' && t.duration_minutes) {
      const ends = new Date(t.starts_at).getTime() + t.duration_minutes * 60000;
      const ms = ends - now;
      if (ms <= 0) {
        bar.textContent = '🏁 Tournament ended';
        bar.style.display = '';
        clearInterval(_timerInterval); _timerInterval = null;
      } else {
        bar.style.display = '';
        bar.innerHTML = `<span style="color:var(--green)">🟢 LIVE</span> &nbsp;·&nbsp; Ends in <strong>${fmt(ms)}</strong>`;
      }
    } else {
      bar.style.display = 'none';
    }
  }
  tick();
  _timerInterval = setInterval(tick, 1000);
}

}[code] || '🌍') : '🌍';

// Time control category per AfriChess standard
// "5+3" → base=5 mins, increment=3s → total = 5*60+40*3 = 420s ≈ 7 min equivalent
function tcCategory(tc) {
  if (!tc) return '';
  try {
    const parts = tc.split('+');
    const base = parseFloat(parts[0]);        // minutes
    const inc  = parts[1] ? parseFloat(parts[1]) : 0;  // seconds
    // FIDE-style equivalent: base + 40*inc/60
    const equiv = base + (40 * inc / 60);
    if (equiv < 0.5)  return 'Hyperbullet';
    if (equiv < 3)    return 'Bullet';
    if (equiv < 5)    return 'Bullet';
    if (equiv < 10)   return 'Blitz';
    if (equiv <= 15)  return 'Rapid';
    return 'Classical';
  } catch { return ''; }
}

    try {
      const pr = await fetch(`/api/profile/${currentUser.id}`,
        { headers: { 'x-user-id': currentUser.id } });
      if (pr.ok) {
        const pd = await pr.json();
        currentProfile = { username: pd.username, elo: pd.elo, country: pd.country };
      }
    } catch(e) { console.warn('Profile load failed', e); }
  }

  // If returning from a tournament game, jump straight into that tournament
  const hash = window.location.hash.replace('#', '');
  if (hash) {
    window.history.replaceState(null, '', '/tournaments'); // clean URL
    loadTournaments();
    viewTournament(hash);
  } else {
    loadTournaments();
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['upcoming','active','completed'][i] === tab);
  });
  stopListPoll();
  loadTournaments();
  if (tab === 'active') startListPoll();
}

async function loadTournaments() {
  const grid = document.getElementById('t-grid');
  grid.innerHTML = '<div class="loading"><span class="spinner"></span>Loading...</div>';

  try {
    const r = await fetch(`/api/tournaments?status=${currentTab}`);
    if (!r.ok) throw new Error('Failed to load');
    const data = await r.json();
    if (!data || !data.length) {
      grid.innerHTML = `<div class="empty">No ${currentTab} tournaments.</div>`; return;
    }

    // Sort: upcoming → soonest first; active → most recently started first; completed → most recent first
    const sorted = [...data].sort((a, b) => {
      const da = new Date(a.starts_at), db = new Date(b.starts_at);
      return currentTab === 'upcoming' ? da - db : db - da;
    });

    grid.innerHTML = sorted.map(t => {
      const starts = new Date(t.starts_at);
      const timeStr = starts.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'}) +
                      ' · ' + starts.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
      const countryStr = t.country ? `${FLAG(t.country)} ${COUNTRY_NAMES[t.country] || t.country} only` : '🌍 Open';
      const formatMeta = t.format === 'arena'
        ? `${t.duration_minutes || 60} min Arena`
        : t.format === 'swiss' ? `Swiss · ${t.rounds || '?'} rounds` : 'Round Robin';
      return `
        <div class="t-card ${t.status}" onclick="viewTournament('${t.id}')">
          <div class="t-status-dot ${t.status}"></div>
          <div class="t-info">
            <div class="t-name">${t.name}</div>
            <div class="t-meta">
              <span>⏱ ${t.time_control} ${tcCategory(t.time_control)}</span>
              <span>📋 ${formatMeta}</span>
              <span>${countryStr}</span>
            </div>
          </div>
          <div class="t-right">
            <div class="t-starts">${timeStr}</div>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    grid.innerHTML = '<div class="empty">Error loading tournaments.</div>';
  }
}

// Auto-refresh the list every 30s when on Live tab (catches auto-ended tournaments)
let _listPoll = null;
function startListPoll() {
  if (_listPoll) return;
  _listPoll = setInterval(() => {
    if (!document.getElementById('detail-view').classList.contains('active')) {
      loadTournaments();
    }
  }, 30000);
}
function stopListPoll() {
  if (_listPoll) { clearInterval(_listPoll); _listPoll = null; }
}

async function viewTournament(id) {
  // Stop any existing poll + timer if switching to a different tournament
  if (currentDetailId && currentDetailId !== id) {
    stopDetailPoll();
    disconnectTournamentWs();
    if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
  }
  currentDetailId = id;

  document.getElementById('list-view').classList.add('hidden');
  const detail = document.getElementById('detail-view');
  const content = document.getElementById('detail-content');
  detail.classList.add('active');

  // Only show full spinner on first load, not on poll refreshes
  if (!content.dataset.loaded) {
    content.innerHTML = '<div class="loading"><span class="spinner"></span>Loading...</div>';
  }

  let t, players, games;
  try {
    const r = await fetch(`/api/tournaments/${id}`);
    if (!r.ok) throw new Error('Not found');
    const data = await r.json();
    t = data.tournament; players = data.players; games = data.games;
  } catch(e) {
    content.innerHTML = '<div class="empty">Error loading tournament.</div>'; return;
  }

  if (!t) { content.innerHTML = '<div class="empty">Tournament not found.</div>'; return; }

  const isRegistered = players && currentUser && players.some(p => p.user_id === currentUser.id);
  const isFull = players && t.max_players && players.length >= t.max_players;
  const starts = new Date(t.starts_at);
  const timeStr = starts.toLocaleDateString('en-GB', {weekday:'short',day:'numeric',month:'short'}) +
                  ' at ' + starts.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});

  // For Arena: flat list of games ordered by time, no round grouping
  // For Swiss/RR: group by round as before
  let pairingsHTML = '';
  if (t.format === 'arena') {
    const arenaGames = [...(games || [])].reverse(); // most recent first
    if (arenaGames.length) {
      pairingsHTML = `<div class="section">
        <div class="section-hdr"><span>Games Played</span><span>${arenaGames.length}</span></div>
        <div>` +
        arenaGames.map(g => {
          let resultHTML = '<span class="pairing-result pending">ongoing</span>';
          if (g.result === 'white') resultHTML = `<span class="pairing-result white-win">1 – 0</span>`;
          else if (g.result === 'black') resultHTML = `<span class="pairing-result black-win">0 – 1</span>`;
          else if (g.result === 'draw') resultHTML = `<span class="pairing-result draw">½ – ½</span>`;
          return `<div class="pairing-row">
            <div class="pairing-player">${g.white_username || '?'}</div>
            <div class="pairing-vs">vs</div>
            <div class="pairing-player" style="text-align:right">${g.black_username || '?'}</div>
            ${resultHTML}
          </div>`;
        }).join('') + '</div></div>';
    }
  } else {
    const rounds = {};
    (games || []).forEach(g => {
      if (!rounds[g.round]) rounds[g.round] = [];
      rounds[g.round].push(g);
    });
    Object.keys(rounds).sort((a,b) => a-b).forEach(r => {
      pairingsHTML += `<div class="section">
        <div class="section-hdr">Round ${r}</div>
        <div>` +
        rounds[r].map(g => {
          let resultHTML = '<span class="pairing-result pending">pending</span>';
          if (g.result === 'white') resultHTML = `<span class="pairing-result white-win">1 – 0</span>`;
          else if (g.result === 'black') resultHTML = `<span class="pairing-result black-win">0 – 1</span>`;
          else if (g.result === 'draw') resultHTML = `<span class="pairing-result draw">½ – ½</span>`;
          return `<div class="pairing-row">
            <div class="pairing-player">${g.white_username || '?'}</div>
            <div class="pairing-vs">vs</div>
            <div class="pairing-player" style="text-align:right">${g.black_username || '?'}</div>
            ${resultHTML}
          </div>`;
        }).join('') + '</div></div>';
    });
  }

  let actionBtn = '';
  if (currentUser) {
    const isCreator = t.created_by === currentUser.id;
    if (t.status === 'upcoming') {
      if (isCreator && (players||[]).length >= 2) {
        actionBtn = `<div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${isRegistered ? `<button class="btn btn-outline btn-sm" onclick="leaveTournament('${id}')">Leave</button>` : ''}
          <button class="btn btn-sm" onclick="startTournament('${id}')">▶ Start Now</button>
        </div>`;
      } else if (isRegistered) {
        actionBtn = `<button class="btn btn-outline btn-sm" onclick="leaveTournament('${id}')">Leave</button>`;
      } else if (!isFull) {
        const userCountry = currentProfile ? currentProfile.country : null;
        const allowed = !t.country || userCountry === t.country;
        if (allowed) {
          actionBtn = `<button class="btn btn-sm" onclick="joinTournament('${id}')">Join</button>`;
        } else {
          actionBtn = `<span style="font-size:11px;color:var(--muted)">Restricted to ${FLAG(t.country)} ${COUNTRY_NAMES[t.country] || t.country}</span>`;
        }
      } else {
        actionBtn = `<span style="font-size:11px;color:var(--muted)">Tournament full</span>`;
      }
    } else if (t.status === 'active' && isCreator && t.format !== 'arena') {
      const currentRound = games && games.length ? Math.max(...games.map(g => g.round)) : 0;
      const pending = (games||[]).filter(g => g.round === currentRound && !g.result).length;
      const nextLabel = currentRound >= t.rounds ? 'Complete Tournament' : `Next Round (${currentRound + 1})`;
      actionBtn = pending === 0
        ? `<button class="btn btn-sm" onclick="nextRound('${id}')">${nextLabel}</button>`
        : `<span style="font-size:11px;color:var(--muted)">${pending} game(s) pending in round ${currentRound}</span>`;
    }
  }

  // Render main content
  content.innerHTML = `
    <div class="detail-header">
      <div style="flex:1">
        <div class="detail-name">${t.name}</div>
        ${t.description ? `<div class="detail-desc">${t.description}</div>` : ''}
        <div>
          <span class="tag ${t.status === 'active' ? 'green' : ''}">${t.status.toUpperCase()}</span>
          <span class="tag">⏱ ${t.time_control} · ${tcCategory(t.time_control)}</span>
          <span class="tag">${t.format === 'arena' ? 'Arena' : t.format === 'swiss' ? 'Swiss' : 'Round Robin'}</span>
          ${t.format === 'arena'
            ? (t.duration_minutes ? `<span class="tag">${t.duration_minutes} min</span>` : '')
            : (t.rounds ? `<span class="tag">${t.rounds} rounds</span>` : '')}
          ${t.country ? `<span class="tag">${FLAG(t.country)} ${COUNTRY_NAMES[t.country]}</span>` : ''}
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:8px;">📅 ${timeStr}</div>
      </div>
      <div>${actionBtn}</div>
    </div>

    <!-- Standings -->
    <div class="section">
      <div class="section-hdr">
        <span>Standings</span>
        <span>${(players||[]).length} players</span>
      </div>
      <div>
        ${(players||[]).length === 0
          ? '<div class="empty" style="padding:20px;">No players yet. Be the first to join!</div>'
          : (() => {
              const sorted = [...(players||[])].sort((a, b) =>
                t.status === 'upcoming'
                  ? (b.elo || 1500) - (a.elo || 1500)
                  : ((b.score||0) - (a.score||0)) || ((b.elo||1500) - (a.elo||1500))
              );
              return sorted.map((p, i) => `
                <div class="player-row">
                  <div class="player-rank">${i+1}</div>
                  <div class="player-country">${FLAG(p.country)}</div>
                  <div class="player-name">${p.username}</div>
                  <div class="player-elo">${p.elo || '?'} ELO</div>
                  <div class="player-score">${p.score || 0}</div>
                </div>`).join('');
            })()}
      </div>
    </div>

    ${pairingsHTML || ''}
  `;
  content.dataset.loaded = '1';

  // Start/restart timer (only if not already ticking for this tournament)
  if (!_timerInterval) startTournamentTimer(t);

  // Connect WS only once per tournament session — don't reconnect on polls
  if (!tournamentWs || currentTournamentId !== id) {
    connectTournamentWs(id, t);
  }

  // Start polling for standings refresh (not WS reconnect)
  startDetailPoll(id);
}

function stopDetailPoll() {
  if (window._tournamentPoll) {
    clearInterval(window._tournamentPoll);
    window._tournamentPoll = null;
  }
}

function startDetailPoll(id) {
  // Only start if not already polling for this id
  if (window._tournamentPoll) return;
  window._tournamentPoll = setInterval(async () => {
    if (!document.getElementById('detail-view').classList.contains('active')) return;
    // Lightweight refresh: only update standings/pairings, don't touch WS or timer
    try {
      const r = await fetch(`/api/tournaments/${id}`);
      if (!r.ok) return;
      const data = await r.json();
      const t = data.tournament; const players = data.players; const games = data.games;
      if (!t) return;

      // If status changed to active and timer isn't running, restart it
      if (!_timerInterval) startTournamentTimer(t);

      // If tournament ended via time, show ended state
      if (t.status === 'completed') {
        stopDetailPoll();
        viewTournament(id); // full reload to show final state
        return;
      }

      // Update standings in-place
      const sorted = [...(players||[])].sort((a, b) =>
        t.status === 'upcoming'
          ? (b.elo || 1500) - (a.elo || 1500)
          : ((b.score||0) - (a.score||0)) || ((b.elo||1500) - (a.elo||1500))
      );
      const standingsEl = document.querySelector('#detail-content .section .player-row')?.closest('div');
      if (standingsEl && players.length > 0) {
        standingsEl.innerHTML = sorted.map((p, i) => `
          <div class="player-row">
            <div class="player-rank">${i+1}</div>
            <div class="player-country">${FLAG(p.country)}</div>
            <div class="player-name">${p.username}</div>
            <div class="player-elo">${p.elo || '?'} ELO</div>
            <div class="player-score">${p.score || 0}</div>
          </div>`).join('');
      }
    } catch(e) {}
  }, 10000);
}

function showList() {
  stopDetailPoll();
  stopListPoll();
  disconnectTournamentWs();
  if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
  currentDetailId = null;
  const content = document.getElementById('detail-content');
  if (content) { content.dataset.loaded = ''; }
  document.getElementById('arena-timer-bar').style.display = 'none';
  document.getElementById('arena-status').style.display = 'none';
  document.getElementById('list-view').classList.remove('hidden');
  document.getElementById('detail-view').classList.remove('active');
  // Refresh list so completed tournaments move to right tab
  loadTournaments();
  if (currentTab === 'active') startListPoll();
}

async function joinTournament(id) {
  if (!currentUser) { window.location.href = '/play'; return; }
  const headers = await getAuthHeader();
  if (!headers) return;
  try {
    const r = await fetch('/api/join-tournament', {
      method: 'POST',
      headers,
      body: JSON.stringify({ tournament_id: id })
    });
    const data = await r.json();
    if (!r.ok) { alert(data.detail || 'Could not join'); return; }
    viewTournament(id);
  } catch (err) {
    alert('Could not join: ' + err.message);
  }
}

async function leaveTournament(id) {
  if (!currentUser) return;
  const headers = await getAuthHeader();
  if (!headers) return;
  try {
    const r = await fetch('/api/leave-tournament', {
      method: 'DELETE',
      headers,
      body: JSON.stringify({ tournament_id: id })
    });
    if (r.ok) viewTournament(id);
  } catch (err) {
    alert('Could not leave: ' + err.message);
  }
}

function openCreate() {
  if (!currentUser) { window.location.href = '/play'; return; }
  // Default start time to next hour
  const d = new Date(); d.setHours(d.getHours() + 1, 0, 0, 0);
  document.getElementById('t-starts').value = d.toISOString().slice(0,16);
  document.getElementById('create-modal').classList.add('active');
}
function closeCreate() {
  document.getElementById('create-modal').classList.remove('active');
  document.getElementById('create-error').textContent = '';
}

function onFormatChange() {
  const fmt = document.getElementById('t-format').value;
  document.getElementById('row-duration').style.display = fmt === 'arena' ? '' : 'none';
  document.getElementById('row-rounds').style.display   = fmt === 'arena' ? 'none' : '';
}

async function createTournament() {
  const name    = document.getElementById('t-name').value.trim();
  const desc    = document.getElementById('t-desc').value.trim();
  const format  = document.getElementById('t-format').value;
  const time    = document.getElementById('t-time').value;
  const country = document.getElementById('t-country').value;
  const starts  = document.getElementById('t-starts').value;
  const errEl   = document.getElementById('create-error');

  if (!name) { errEl.textContent = 'Please enter a tournament name.'; return; }
  if (!starts) { errEl.textContent = 'Please set a start date and time.'; return; }

  const headers = await getAuthHeader();
  if (!headers) { errEl.textContent = 'Session expired. Please sign in again.'; return; }

  const body = { name, description: desc || null, format, time_control: time,
                 country: country || null, starts_at: new Date(starts).toISOString() };
  if (format === 'arena') {
    body.duration_minutes = parseInt(document.getElementById('t-duration').value);
    body.rounds = 0;
  } else {
    body.rounds = parseInt(document.getElementById('t-rounds').value);
  }

  try {
    const r = await fetch('/api/create-tournament', { method: 'POST', headers, body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.detail || 'Create failed'; return; }
    closeCreate();
    loadTournaments();
    viewTournament(data.tournament.id);
  } catch (err) {
    errEl.textContent = err.message || 'Create failed';
  }
}

// ── Arena WebSocket ──────────────────────────────────────────────
// WS connects ONCE per tournament visit — polls never touch it
let tournamentWs = null, currentTournamentId = null, _arenaCountdown = null;

function connectTournamentWs(tid, tournament) {
  // Already connected to this tournament — don't reconnect
  if (tournamentWs && currentTournamentId === tid &&
      (tournamentWs.readyState === WebSocket.OPEN || tournamentWs.readyState === WebSocket.CONNECTING)) {
    return;
  }
  if (tournamentWs) { tournamentWs.close(); tournamentWs = null; }
  currentTournamentId = tid;
  if (!currentUser || tournament.format !== 'arena') return;

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  tournamentWs = new WebSocket(`${proto}://${location.host}/ws/tournament/${tid}`);

  tournamentWs.onopen = () => {
    tournamentWs.send(JSON.stringify({
      user_id:  currentUser.id,
      username: currentProfile ? currentProfile.username : (currentUser.email || 'player'),
      elo:      currentProfile ? (currentProfile.elo || 1500) : 1500,
      score:    0,
    }));
    tournamentWs._ping = setInterval(() => {
      if (tournamentWs && tournamentWs.readyState === WebSocket.OPEN)
        tournamentWs.send(JSON.stringify({ type: 'ping' }));
    }, 20000);
  };

  tournamentWs.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'game_ready') {
        showArenaGameReady(msg);
      } else if (msg.type === 'game_over') {
        hideArenaCountdown();
        if (tournamentWs && tournamentWs.readyState === WebSocket.OPEN)
          tournamentWs.send(JSON.stringify({ type: 'available', score: 0 }));
        showArenaStatus('Game over. Waiting for next pairing…');
      } else if (msg.type === 'tournament_ended') {
        hideArenaCountdown();
        const reason = msg.reason || 'Tournament has ended.';
        showArenaStatus('🏁 ' + reason + ' Final standings are shown below.');
        stopDetailPoll();
        if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
        const bar = document.getElementById('arena-timer-bar');
        if (bar) { bar.textContent = '🏁 Tournament ended'; bar.style.display = ''; }
        setTimeout(() => { if (currentDetailId) viewTournament(currentDetailId); }, 2000);
      } else if (msg.type === 'bye') {
        hideArenaCountdown();
        showArenaStatus('⏸ ' + (msg.message || 'You have a bye this round — waiting for next pairing…'));
      } else if (msg.type === 'tournament_started') {
        // Another player triggered start — reload our view
        if (currentDetailId) viewTournament(currentDetailId);
      }
    } catch(err) {}
  };

  tournamentWs.onclose = () => {
    if (tournamentWs && tournamentWs._ping) clearInterval(tournamentWs._ping);
    // Attempt reconnect after 3s if we're still on this detail view
    setTimeout(() => {
      if (currentDetailId === tid && document.getElementById('detail-view').classList.contains('active')) {
        if (!tournamentWs || tournamentWs.readyState === WebSocket.CLOSED) {
          // Fetch fresh tournament data for reconnect
          fetch(`/api/tournaments/${tid}`).then(r => r.json()).then(data => {
            if (data && data.tournament && data.tournament.status === 'active') {
              connectTournamentWs(tid, data.tournament);
            }
          }).catch(() => {});
        }
      }
    }, 3000);
  };

  tournamentWs.onerror = () => {};
}

function showArenaGameReady(msg) {
  const el = document.getElementById('arena-status');
  if (!el) return;
  // Clear any previous countdown
  hideArenaCountdown();
  el.innerHTML = `<strong>♟ Game ready!</strong> You play <strong>${msg.color}</strong> vs <strong>${msg.opponent}</strong> (${msg.opponent_elo} ELO)<br>
    <span id="arena-countdown" style="font-size:12px;color:#aaa;">Redirecting in 5…</span>`;
  el.style.display = '';
  let secs = 5;
  _arenaCountdown = setInterval(() => {
    secs--;
    const cd = document.getElementById('arena-countdown');
    if (cd) cd.textContent = `Redirecting in ${secs}…`;
    if (secs <= 0) {
      clearInterval(_arenaCountdown); _arenaCountdown = null;
      const tc = encodeURIComponent(msg.time_control || '');
      window.location.href = `/multiplayer?game_id=${msg.game_id}&color=${msg.color}&tournament_id=${currentTournamentId}&tournament_db_id=${msg.tournament_db_id || ''}&time_control=${tc}`;
    }
  }, 1000);
}

function hideArenaCountdown() {
  if (_arenaCountdown) { clearInterval(_arenaCountdown); _arenaCountdown = null; }
}

function showArenaStatus(text) {
  const el = document.getElementById('arena-status');
  if (el) { el.innerHTML = text; el.style.display = ''; }
}

function disconnectTournamentWs() {
  hideArenaCountdown();
  if (tournamentWs) {
    if (tournamentWs._ping) clearInterval(tournamentWs._ping);
    tournamentWs.close(); tournamentWs = null;
  }
}

async function getAuthHeader() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/play'; return null; }
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` };
}

async function startTournament(id) {
  if (!currentUser) return;
  const headers = await getAuthHeader();
  if (!headers) return;
  const r = await fetch('/api/tournament/start', {
    method: 'POST',
    headers,
    body: JSON.stringify({ tournament_id: id, user_id: currentUser.id })
  });
  const data = await r.json();
  if (!r.ok) { alert(data.detail || 'Could not start tournament'); return; }
  viewTournament(id);
}

async function nextRound(id) {
  if (!currentUser) return;
  const headers = await getAuthHeader();
  if (!headers) return;
  const r = await fetch('/api/tournament/next-round', {
    method: 'POST',
    headers,
    body: JSON.stringify({ tournament_id: id, user_id: currentUser.id })
  });
  const data = await r.json();
  if (!r.ok) { alert(data.detail || 'Could not advance round'); return; }
  if (data.completed) { alert('Tournament completed! Final standings are above.'); }
  viewTournament(id);
}

async function signOut() {
  await sb.auth.signOut();
  window.location.href = '/';
}

init();
