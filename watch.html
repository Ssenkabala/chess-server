  <style>
    :root {
      --bg:     #0a0a0a;
      --text:   #e8e8e8;
      --muted:  #555;
      --green:  #00ff9d;
      --border: #1a1a1a;
      --card:   #111;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
           min-height: 100vh; }

    /* ── Nav ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .top-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
      font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .nav-links { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .nav-links a {
      color: var(--muted); font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; text-decoration: none; cursor: pointer;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--green); }
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 6px;
    }
    .hamburger span { display: block; width: 22px; height: 2px; background: #888; }
    .mobile-drawer {
      position: fixed; top: 0; right: -260px; width: 240px; height: 100vh;
      background: #0d0d0d; border-left: 1px solid #1a1a1a;
      display: flex; flex-direction: column;
      padding: 72px 24px 32px; gap: 20px; z-index: 500;
      transition: right 0.28s ease;
    }
    .mobile-drawer a {
      color: #555; text-decoration: none; font-size: 13px;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 8px 0; border-bottom: 1px solid #1a1a1a;
    }
    .mobile-drawer a.active { color: var(--green); }
    .drawer-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 499;
    }
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
    }

    /* ── Layout ── */
    .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase;
         color: var(--green); margin-bottom: 6px; }
    .subtitle { font-size: 12px; color: var(--muted); margin-bottom: 24px; }

    /* ── Games List ── */
    #games-list { display: flex; flex-direction: column; gap: 12px; }
    .game-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: border-color 0.2s;
      gap: 12px; flex-wrap: wrap;
    }
    .game-card:hover { border-color: var(--green); }
    .game-players { font-size: 14px; font-weight: 600; }
    .game-players .vs { color: var(--muted); margin: 0 8px; font-weight: 400; }
    .game-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .watch-btn {
      background: transparent; border: 1px solid var(--green);
      color: var(--green); padding: 8px 18px; border-radius: 3px;
      font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: background 0.2s, color 0.2s; white-space: nowrap;
    }
    .watch-btn:hover { background: var(--green); color: #000; }
    .spectator-count { font-size: 11px; color: var(--muted); }
    .no-games {
      text-align: center; padding: 48px 20px;
      color: var(--muted); font-size: 13px; letter-spacing: 0.05em;
    }
    .live-dot {
      display: inline-block; width: 8px; height: 8px;
      background: #ff4444; border-radius: 50%;
      animation: pulse 1.4s ease infinite; margin-right: 6px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    /* ── Board view ── */
    #watch-view { display: none; }
    .watch-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .back-btn {
      background: transparent; border: 1px solid #333;
      color: var(--muted); padding: 7px 14px; border-radius: 3px;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: color 0.2s, border-color 0.2s;
    }
    .back-btn:hover { color: var(--green); border-color: var(--green); }
    .watch-title { font-size: 14px; font-weight: 600; }
    .watch-tc { font-size: 11px; color: var(--muted); }

    .watch-layout {
      display: grid;
      grid-template-columns: auto 280px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 720px) {
      .watch-layout { grid-template-columns: 1fr; }
    }

    .board-wrap {
      position: relative;
      width: min(500px, calc(100vw - 32px));
      max-width: 500px;
    }

    .cg-wrap {
      width: 100%; max-width: min(92vw, 480px); padding-bottom: 100%; position: relative;
      margin: 0 auto;
    }
    cg-board { position: absolute; inset: 0; }

    .player-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: var(--card);
      border: 1px solid var(--border); border-radius: 4px; margin: 4px 0;
    }
    .player-name { font-size: 13px; font-weight: 600; }
    .player-elo { font-size: 11px; color: var(--muted); }
    .player-clock {
      font-size: 18px; font-weight: 700; font-family: monospace;
      color: var(--text);
    }
    .player-clock.low { color: #ff4444; }
    .active-player { border-color: var(--green); }

    .watch-panel { display: flex; flex-direction: column; gap: 12px; }
    .move-list-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; padding: 16px;
      max-height: 340px; overflow-y: auto;
    }
    .move-list-title {
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 12px;
    }
    .move-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .move-pair { display: flex; align-items: center; gap: 4px; font-size: 13px; }
    .move-num { color: var(--muted); font-size: 11px; min-width: 22px; }
    .move-san {
      padding: 2px 6px; border-radius: 3px;
      background: #1a1a1a; cursor: pointer; transition: background 0.15s;
    }
    .move-san:hover { background: #252525; }
    .move-san.current { background: var(--green); color: #000; font-weight: 700; }

    .status-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; padding: 14px 16px;
      font-size: 12px; color: var(--muted); text-align: center;
    }
    .spectator-info {
      font-size: 11px; color: var(--muted); text-align: center;
    }
  </style>
</head>

<!-- CSS -->
<style>
#afri-banner {
  display: none;
  position: relative;
  width: 100%;
  padding: 11px 48px 11px 16px;
  font-size: 13px;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.02em;
  line-height: 1.5;
  text-align: center;
  z-index: 9999;
  box-sizing: border-box;
}
#afri-banner.info    { background: #0d2b1e; color: #00ff9d; border-bottom: 1px solid #00ff9d33; }
#afri-banner.warning { background: #2b2200; color: #ffcc44; border-bottom: 1px solid #ffcc4433; }
#afri-banner.urgent  { background: #2b0d0d; color: #ff5555; border-bottom: 1px solid #ff555533; }
#afri-banner-close {
  position: absolute;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: inherit; opacity: 0.6;
  font-size: 18px; cursor: pointer;
  padding: 4px 6px; line-height: 1;
}
#afri-banner-close:hover { opacity: 1; }
</style>
<div id="afri-banner" role="alert">
  <span id="afri-banner-msg"></span>
  <button id="afri-banner-close" onclick="afriBannerDismiss()" aria-label="Dismiss">×</button>
</div>
<script>
(function() {
  var POLL_INTERVAL = 5 * 60 * 1000; // re-check every 5 minutes

  function afriBannerDismiss() {
    var el = document.getElementById('afri-banner');
    if (!el) return;
    var nid = el.dataset.nid;
    if (nid) localStorage.setItem('afri_banner_dismissed_' + nid, '1');
    el.style.display = 'none';
  }
  window.afriBannerDismiss = afriBannerDismiss;

  function afriBannerShow(n) {
    if (!n || !n.message) return;
    if (localStorage.getItem('afri_banner_dismissed_' + n.id)) return;
    var el  = document.getElementById('afri-banner');
    var msg = document.getElementById('afri-banner-msg');
    if (!el || !msg) return;
    el.className = n.type || 'info';
    el.dataset.nid = n.id;
    msg.textContent = n.message;
    el.style.display = 'block';
  }

  function afriBannerPoll() {
    fetch('/api/notification')
      .then(function(r) { return r.json(); })
      .then(function(d) { if (d && d.notification) afriBannerShow(d.notification); })
      .catch(function() {});  // fail silently
  }

  afriBannerPoll();
  setInterval(afriBannerPoll, POLL_INTERVAL);
})();
</script>

      <div class="watch-header">
        <button class="back-btn" onclick="backToList()">← Back</button>
        <div>
          <div class="watch-title" id="watch-title">Loading…</div>
          <div class="watch-tc" id="watch-tc"></div>
        </div>
        <div class="spectator-info" id="spectator-count"></div>
      </div>

      <div class="watch-layout">
        <!-- Board column -->
        <div class="board-wrap">
          <div class="player-bar" id="bar-top">
            <div>
              <div class="player-name" id="name-top">—</div>
              <div class="player-elo" id="elo-top"></div>
            </div>
            <div class="player-clock" id="clock-top">—</div>
          </div>

          <div class="cg-wrap" id="cg-container"></div>

          <div class="player-bar" id="bar-bottom">
            <div>
              <div class="player-name" id="name-bottom">—</div>
              <div class="player-elo" id="elo-bottom"></div>
            </div>
            <div class="player-clock" id="clock-bottom">—</div>
          </div>
        </div>

        <!-- Side panel -->
        <div class="watch-panel">
          <div class="status-box" id="watch-status">Connecting…</div>

          <div class="move-list-box">
            <div class="move-list-title">Moves</div>
            <div class="move-list" id="move-list"></div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /page -->

  <script>
  // ── Config ────────────────────────────────────────────────────────────────
  const WS_BASE  = location.protocol === 'https:' ? 'wss://' + location.host : 'ws://' + location.host;

  // ── Nav drawer ───────────────────────────────────────────────────────────
  function toggleDrawer() {
    const d = document.getElementById('mobile-drawer');
    const o = document.getElementById('drawer-overlay');
    const open = d.style.right === '0px';
    d.style.right  = open ? '-260px' : '0px';
    o.style.display = open ? 'none'   : 'block';
  }

  // ── State ────────────────────────────────────────────────────────────────
  let cg          = null;
  let watchWs     = null;
  let chess       = null;
  let sanHistory  = [];
  let clockW      = 0;
  let clockB      = 0;
  let watchOrientation = 'white';
  let clockTick   = null;
  let lastTurn    = 'white';
  let tickStart   = null;

  // ── List view ─────────────────────────────────────────────────────────────
  async function loadGames() {
    try {
      const r = await fetch('/api/games/live');
      const games = await r.json();
      renderGamesList(games);
    } catch(e) {
      document.getElementById('games-list').innerHTML =
        '<div class="no-games">Failed to load games. Please refresh.</div>';
    }
  }

  function renderGamesList(games) {
    const el = document.getElementById('games-list');
    if (!games.length) {
      el.innerHTML = '<div class="no-games">No live games right now.<br>Check back soon or <a href="/multiplayer" style="color:var(--green)">start a game</a>.</div>';
      return;
    }
    el.innerHTML = games.map(g => `
      <div class="game-card" onclick="watchGame('${g.id}', '${escHtml(g.white)}', '${escHtml(g.black)}', '${g.white_elo}', '${g.black_elo}', '${g.time_control}')">
        <div>
          <div class="game-players">
            ${escHtml(g.white)} <span class="vs">vs</span> ${escHtml(g.black)}
          </div>
          <div class="game-meta">
            ${g.time_control} · ${g.moves} move${g.moves !== 1 ? 's' : ''}
            ${g.spectators > 0 ? `· 👁 ${g.spectators} watching` : ''}
          </div>
        </div>
        <button class="watch-btn">Watch</button>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Watch a game ──────────────────────────────────────────────────────────
  function watchGame(gameId, white, black, whiteElo, blackElo, tc) {
    document.getElementById('list-view').style.display  = 'none';
    document.getElementById('watch-view').style.display = '';

    document.getElementById('watch-title').textContent = `${white} vs ${black}`;
    document.getElementById('watch-tc').textContent    = tc;

    // Init board (view-only)
    chess      = new Chess();
    sanHistory = [];
    renderMoveList();
    setStatus('Connecting…');

    document.getElementById('name-top').textContent    = black;
    document.getElementById('elo-top').textContent     = `ELO ${blackElo}`;
    document.getElementById('name-bottom').textContent = white;
    document.getElementById('elo-bottom').textContent  = `ELO ${whiteElo}`;

    if (cg) { cg.destroy(); cg = null; }
    const el = document.getElementById('cg-container');
    el.innerHTML = '';

    function initBoardWhenReady(attempt) {
      attempt = attempt || 0;
      const rect = el.getBoundingClientRect();
      if (rect.width < 10) {
        if (attempt > 180) {  // ~3s at 60fps
          setStatus('Could not load board — try refreshing.');
          console.error('[watch] cg-container never got a usable width:', rect);
          return;
        }
        requestAnimationFrame(() => initBoardWhenReady(attempt + 1));
        return;
      }
      cg = Chessground(el, {
        viewOnly:    true,
        orientation: 'white',
        animation:   { enabled: true, duration: 150 },
        highlight:   { lastMove: true, check: true },
      });
      if (watchWs) { watchWs.close(); watchWs = null; }
      watchWs = new WebSocket(`${WS_BASE}/ws/watch/${gameId}`);
      watchWs.onmessage = (e) => { onWatchMsg(e, white, black); };
      watchWs.onclose   = () => { setStatus('Disconnected.'); };
      watchWs.onerror   = () => { setStatus('Connection error.'); };
    }
    requestAnimationFrame(() => requestAnimationFrame(() => initBoardWhenReady(0)));
  }

  function onWatchMsg(e, white, black) {
      const msg = JSON.parse(e.data);
      if (msg.type === 'ping') return;

      if (msg.type === 'game_state') {
        // Initial state — set board position
        chess = new Chess(msg.fen);
        cg.set({ fen: msg.fen });
        clockW = msg.clock?.w ?? 0;
        clockB = msg.clock?.b ?? 0;
        lastTurn = msg.turn || 'white';
        updateClocks();
        startClockTick(msg.turn);
        setStatus(msg.turn === 'white' ? `${white} to move` : `${black} to move`);
        document.getElementById('watch-title').textContent =
          `${msg.white || white} vs ${msg.black || black}`;
        const specs = msg.spectators;
        if (specs !== undefined)
          document.getElementById('spectator-count').textContent = `👁 ${specs + 1} watching`;
      }

      if (msg.type === 'move') {
        // Apply move to chess.js for SAN
        const chessMove = chess.move({ from: msg.move.slice(0,2), to: msg.move.slice(2,4),
                                        promotion: msg.move[4] || 'q' });
        if (chessMove) {
          sanHistory.push(chessMove.san);
          renderMoveList();
        }
        // Update board
        const from = msg.move.slice(0,2), to = msg.move.slice(2,4);
        cg.set({ fen: msg.fen, lastMove: [from, to] });

        // Update clocks
        clockW = msg.clock?.w ?? clockW;
        clockB = msg.clock?.b ?? clockB;
        lastTurn = msg.turn || (msg.move ? (chess.turn() === 'w' ? 'white' : 'black') : lastTurn);
        updateClocks();
        startClockTick(lastTurn);

        // Highlight active player
        updateActiveBars(lastTurn);
        const mover = lastTurn === 'white' ? white : black;
        setStatus(`${mover} to move`);
      }

      if (msg.type === 'gameover') {
        stopClockTick();
        const resultText = msg.result === 'draw'
          ? 'Game drawn'
          : `${msg.result === 'white' ? white : black} wins`;
        setStatus(`${resultText} · ${msg.reason || ''}`);
        document.getElementById('bar-top').classList.remove('active-player');
        document.getElementById('bar-bottom').classList.remove('active-player');
      }

      if (msg.type === 'game_ended') {
        stopClockTick();
        setStatus('Game finished.');
      }
  }

  function backToList() {
    if (watchWs) { watchWs.close(); watchWs = null; }
    stopClockTick();
    document.getElementById('watch-view').style.display = 'none';
    document.getElementById('list-view').style.display  = '';
    loadGames(); // refresh list
  }

  // ── Clock ─────────────────────────────────────────────────────────────────
  function fmtClock(secs) {
    if (secs <= 0) return '0:00';
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function updateClocks() {
    const topEl    = document.getElementById('clock-top');
    const bottomEl = document.getElementById('clock-bottom');
    topEl.textContent    = fmtClock(clockB);
    bottomEl.textContent = fmtClock(clockW);
    topEl.classList.toggle('low',    clockB < 30);
    bottomEl.classList.toggle('low', clockW < 30);
  }

  function startClockTick(turn) {
    stopClockTick();
    tickStart = Date.now();
    clockTick = setInterval(() => {
      const elapsed = (Date.now() - tickStart) / 1000;
      tickStart = Date.now();
      if (turn === 'white') clockW = Math.max(0, clockW - elapsed);
      else                  clockB = Math.max(0, clockB - elapsed);
      updateClocks();
    }, 200);
  }

  function stopClockTick() {
    if (clockTick) { clearInterval(clockTick); clockTick = null; }
  }

  function updateActiveBars(turn) {
    document.getElementById('bar-top').classList.toggle('active-player',    turn === 'black');
    document.getElementById('bar-bottom').classList.toggle('active-player', turn === 'white');
  }

  // ── Move list ─────────────────────────────────────────────────────────────
  function renderMoveList() {
    const el = document.getElementById('move-list');
    el.innerHTML = '';
    for (let i = 0; i < sanHistory.length; i += 2) {
      const pair = document.createElement('div');
      pair.className = 'move-pair';
      const num = document.createElement('span');
      num.className = 'move-num';
      num.textContent = `${Math.floor(i/2) + 1}.`;
      pair.appendChild(num);

      [0, 1].forEach(j => {
        if (sanHistory[i + j] !== undefined) {
          const m = document.createElement('span');
          m.className = 'move-san' + (i + j === sanHistory.length - 1 ? ' current' : '');
          m.textContent = sanHistory[i + j];
          pair.appendChild(m);
        }
      });
      el.appendChild(pair);
    }
    // Auto-scroll to bottom
    el.scrollTop = el.scrollHeight;
  }

  function setStatus(msg) {
    document.getElementById('watch-status').textContent = msg;
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  // Direct link from tournament: /watch?game=GAME_ID
  const _directGame = new URLSearchParams(location.search).get('game');
  console.log('[watch-debug] _directGame =', _directGame);
  if (_directGame) {
    // Load game info from live games list then jump to board
    fetch('/api/games/live')
      .then(r => {
        console.log('[watch-debug] /api/games/live responded, status=' + r.status);
        return r.json();
      })
      .then(games => {
        console.log('[watch-debug] live games list:', games.map(g => g.id));
        const g = games.find(x => x.id === _directGame);
        console.log('[watch-debug] match found?', !!g);
        if (g) {
          watchGame(g.id, g.white, g.black, g.white_elo, g.black_elo, g.time_control);
        } else {
          // Game not found in live list — show list with message
          document.getElementById('games-list').innerHTML =
            '<div class="no-games">That game has already finished or could not be found.<br>' +
            'Here are the current live games:</div>';
          loadGames();
        }
      })
      .catch((e) => { console.log('[watch-debug] fetch/parse FAILED:', e); loadGames(); });
  } else {
    loadGames();
  }
  // Refresh list every 15 seconds when on list view
  setInterval(() => {
    if (document.getElementById('list-view').style.display !== 'none') {
      loadGames();
    }
  }, 15000);

  // Presence ping
  const _pt = Math.random().toString(36).slice(2);
  async function pingPresence() {
    try { await fetch('/api/ping', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({token: _pt}) }); } catch(e) {}
  }
  pingPresence(); setInterval(pingPresence, 30000);
  </script>
</body>
</html>
